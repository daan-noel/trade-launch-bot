# ---------------------------------------------------------------------------
# Serves the built React SPA and reverse-proxies /api to the backend container.
# TLS-terminating: HTTPS on 443, plain HTTP on 80 redirects up to HTTPS.
# ---------------------------------------------------------------------------

# Plain HTTP -> redirect everything to HTTPS. No auth here so the redirect
# itself never prompts for credentials.
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Self-signed cert for local/testing (regenerate with openssl; see
    # nginx/tls/). Swap in a real cert for production.
    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # HTTP Basic Auth gate for the whole site (SPA + /api). The location blocks
    # below inherit these directives. Credentials live in nginx/.htpasswd
    # (bcrypt), copied into the image by the frontend Dockerfile.
    auth_basic           "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Backend API. No trailing slash on proxy_pass => the /api/ prefix is
    # preserved, matching the backend's /api/... routes.
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # SPA fallback: let react-router handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
