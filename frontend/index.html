<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meme Trading</title>
    <link data-trunk rel="rust" href="Cargo.toml" />
    <link data-trunk rel="css" href="src/components/data_table/data_table.css" />
    <link data-trunk rel="css" href="src/components/modal/modal.css" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            /* Main colors */
            --dark: #0f0f0f;
            --primary: #13ceaf;
            --secondary: #eed35a;
            --danger: #f23645;

            /* Secondary colors */
            --warning: #f4e07a;
            --info: #4c7ef0;
            --accent: #f69768;

            /* Backgrounds */
            --bg: #0f0f0f;
            --bg-panel: #1a1a1a;
            --bg-card: #222222;
            --bg-hover: #2a2a2a;
            --bg-table-header: #1a1a1a;
            --bg-table-body: #141414;
            --border: #2a2a2a;
            --border-dim: #1a1a1a;

            /* Text colors */
            --text: #e8e8e8;
            --text-dim: #999999;
            --text-mid: #b3b3b3;

            /* Semantic colors */
            --green: #089981;
            --green-dim: rgba(8, 153, 129, 0.12);
            --row-hover-bg: rgba(8, 153, 129, 0.05);
            --selected-row-bg: rgba(8, 153, 129, 0.18);
            --selected-row-hover-bg: rgba(8, 153, 129, 0.15);
            --hovered-column-bg: rgba(8, 153, 129, 0.12);
            --hovered-cell-bg: rgba(8, 153, 129, 0.25);
            --hovered-cell-border: rgba(8, 153, 129, 0.45);
            --red: #f23645;
            --red-dim: rgba(242, 54, 69, 0.12);

            /* Ratio colors */
            --bg-ath-fep-ratio: rgba(244, 224, 122, 0.08);
            --ath-fep-ratio: #f4e07a;
            --bg-current-fep-ratio: rgba(79, 206, 240, 0.08);
            --current-fep-ratio: #4fcef0;

            /* Navigation */
            --nav-h: 48px;
            --font: 'Inter', system-ui, -apple-system, sans-serif;
            --mono: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
        }

        html,
        body {
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 13px;
            line-height: 1.5;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* ── Top nav ──────────────────────────────────────────────────── */
        .topnav {
            position: sticky;
            top: 0;
            z-index: 100;
            height: var(--nav-h);
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 2px solid var(--primary);
        }

        .topnav-inner {
            display: flex;
            align-items: center;
            height: 100%;
            padding: 0 20px;
            gap: 32px;
        }

        /* brand */
        .brand {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .brand-icon {
            font-size: 16px;
            color: var(--primary);
        }

        .brand-name {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .04em;
            color: var(--primary);
        }

        .brand-suffix {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-dim);
            letter-spacing: .08em;
        }

        /* nav links */
        .nav-links {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .nav-link {
            position: relative;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-mid);
            transition: background .15s, color .15s;
        }

        .nav-link:hover {
            background: rgba(8, 153, 129, 0.08);
            color: var(--text);
        }

        .nav-link.active {
            color: var(--primary);
            background: rgba(8, 153, 129, 0.1);
        }

        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 8px;
            right: 8px;
            height: 2px;
            border-radius: 2px 2px 0 0;
            background: var(--primary);
            box-shadow: 0 0 8px rgba(8, 153, 129, 0.6);
        }

        /* ── Sub-nav dropdown (Strategies) ───────────────────────────── */
        .nav-item {
            position: relative;
        }

        .nav-item .subnav {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            min-width: 120px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 4px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
            z-index: 200;
            flex-direction: column;
            gap: 2px;
        }

        .nav-item:hover .subnav,
        .nav-item:focus-within .subnav {
            display: flex;
        }

        .subnav-link {
            display: block;
            padding: 6px 12px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-mid);
            white-space: nowrap;
            transition: background .12s, color .12s;
        }

        .subnav-link:hover {
            background: rgba(8, 153, 129, 0.08);
            color: var(--text);
        }

        .subnav-link.active {
            color: var(--primary);
            background: rgba(8, 153, 129, 0.1);
            font-weight: 700;
        }

        .subnav-arrow {
            font-size: 9px;
            opacity: 0.55;
            margin-left: 2px;
        }

        /* right slot */
        .topnav-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chain-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            font-size: 11px;
            font-weight: 600;
            color: var(--primary);
            background: transparent;
            letter-spacing: .06em;
        }
        .chain-badge.sol {
            color: var(--text);
            border: 1px solid var(--primary);
        }

        .chain-badge.usd {
            color: var(--secondary);
            border: 1px solid var(--secondary);
        }

        .chain-badge > .chain-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 6px var(--primary);
            animation: pulse 2s ease-in-out infinite;
        }
        .chain-badge.sol > .chain-dot {
            background: var(--primary);
            box-shadow: 0 0 6px var(--primary);
        }
        .chain-badge.usd > .chain-dot {
            background: var(--secondary);
            box-shadow: 0 0 6px var(--secondary);
        }

        

        .btn,
        .status-button,
        .mode-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 32px;
            padding: 0 14px;
            border-radius: 999px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background .15s, border-color .15s, color .15s, box-shadow .15s;
        }

        .status-button.live,
        .mode-button.live {
            background: var(--green-dim);
            color: var(--green);
            border-color: rgba(8, 153, 129, 0.35);
            box-shadow: 0 0 12px rgba(8, 153, 129, 0.15);
        }

        .status-button.dead,
        .mode-button.dead {
            background: var(--red-dim);
            color: var(--red);
            border-color: rgba(242, 54, 69, 0.35);
        }

        .btn:hover,
        .status-button:hover,
        .mode-button:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .btn:disabled,
        .status-button:disabled,
        .mode-button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .unit-widget {
            display: flex;
            align-items: center;
            gap: 8px;
        }



        .unit-input-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .unit-input {
            width: 90px;
            min-height: 32px;
            padding: 0 10px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            font-size: 11px;
            outline: none;
        }

        .unit-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(8, 153, 129, 0.1);
        }

        .unit-apply {
            min-width: 32px;
            padding: 0 10px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(8, 153, 129, 0.12);
            color: var(--primary);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background .15s, border-color .15s;
        }

        .unit-apply:hover {
            background: rgba(8, 153, 129, 0.18);
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .4;
            }
        }

        /* ── Page shell ───────────────────────────────────────────────── */
        .page-shell {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .page-body {
            flex: 1;
            padding: 20px 24px;
        }

        /* ── Section header ───────────────────────────────────────────── */
        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
        }

        .trade-table .price-normal {
            color: var(--text) !important;
        }

        .trade-table .price-e-3 {
            color: var(--info) !important;
        }

        .trade-table .price-e-6 {
            color: #7cdbff !important;
        }

        .trade-table .price-e-9 {
            color: #82b7ff !important;
        }

        .trade-table .price-e-12 {
            color: var(--accent) !important;
        }

        .trade-table .price-e-15 {
            color: #ff8bce !important;
        }

        .trade-table .price-e-smaller {
            color: var(--warning) !important;
        }

        .trade-table .th-cost {
            background: var(--bg-ath-fep-ratio) !important;
        }

        .trade-table .th-liquidity {
            background: var(--bg-current-fep-ratio) !important;
        }

        .trade-table .cost-col {
            background: var(--bg-ath-fep-ratio);
            color: var(--text) !important;
            font-weight: 700;
        }

        .trade-table .liquidity-col {
            background: var(--bg-current-fep-ratio);
            color: var(--text) !important;
            font-weight: 700;
        }

        .first-entry-price {
            margin-left: 0.35rem;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9em;
            font-weight: 400;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(8, 153, 129, 0.12);
            border: 1px solid rgba(8, 153, 129, 0.3);
            font-size: 10px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: .08em;
        }

        .live-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--primary);
            animation: pulse 1.5s ease-in-out infinite;
        }

        .live-dot-off {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--text-dim);
        }

        .live-toggle-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 10px;
            font-weight: 700;
            color: var(--text-dim);
            letter-spacing: .08em;
            cursor: pointer;
            transition: background .15s, border-color .15s, color .15s;
        }

        .live-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            color: var(--text-mid);
        }

        .live-toggle-btn.live-toggle-active {
            background: rgba(8, 153, 129, 0.12);
            border-color: rgba(8, 153, 129, 0.3);
            color: var(--primary);
        }

        .live-toggle-btn.live-toggle-active:hover {
            background: rgba(8, 153, 129, 0.2);
            border-color: rgba(8, 153, 129, 0.5);
        }

        /* ── Hero (home page) ─────────────────────────────────────────── */
        .page-hero {
            padding: 60px 0 20px;
        }

        .hero-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
        }

        .hero-sub {
            margin-top: 8px;
            font-size: 14px;
            color: var(--text-mid);
        }

        /* ── Table wrapper ────────────────────────────────────────────── */
        .table-wrapper {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        /* controls bar */
        .table-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: var(--bg-table-header);
            border: 1px solid var(--border);
            border-bottom: 2px solid var(--primary);
            border-radius: 8px 8px 0 0;
        }

        .table-total {
            font-size: 12px;
            color: var(--primary);
            font-family: var(--mono);
            font-weight: 600;
        }

        .page-size-label {
            font-size: 12px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .page-size-label select {
            background: var(--bg-panel);
            color: var(--text);
            border: 1px solid var(--primary);
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
            outline: none;
            font-weight: 500;
        }

        .page-size-label select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(246, 151, 104, 0.2);
        }

        .pagination-component {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            padding: 4px 16px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(8, 153, 129, 0.18);
            border-radius: 12px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
            align-items: center;
            justify-content: space-between;
            margin: 12px 0;
        }

        .pagination-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: flex-start;
        }

        .page-nav,
        .page-button {
            min-width: 34px;
            height: 34px;
            border: none;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.8);
            color: var(--text);
            font-weight: 700;
            cursor: pointer;
            transition: transform .14s ease, background .18s ease, color .18s ease;
        }

        .page-nav:hover,
        .page-button:hover {
            transform: translateY(-1px);
            background: rgba(8, 153, 129, 0.2);
            color: var(--primary);
        }

        .page-button.active {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.22), rgba(56, 189, 248, 0.1));
            color: var(--primary);
            box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.18);
        }

        .page-button:disabled,
        .page-nav:disabled {
            opacity: 0.45;
            cursor: default;
        }

        .page-ellipsis {
            color: var(--text-mid);
            font-size: 14px;
            padding: 0 6px;
        }

        .pagination-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            align-items: center;
            flex: 1 1 auto;
            min-width: 240px;
        }

        .pagination-summary {
            font-size: 12px;
            color: var(--text-mid);
            font-family: var(--mono);
            flex: 1 1 auto;
            min-width: 120px;
        }

        .page-size-label {
            font-size: 12px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.04);
        }

        /* scrollable table area */
        .table-scroll {
            overflow-x: auto;
            border: 1px solid var(--primary);
            border-radius: 0 0 8px 8px;
        }

        /* table */
        .trade-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            font-family: var(--mono);
            table-layout: auto;
        }

        .trade-table th {
            position: sticky;
            top: 0;
            padding: 10px 8px;
            background: var(--bg-table-header);
            color: var(--primary);
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .08em;
            border-bottom: 2px solid var(--primary);
            white-space: normal;
            word-break: break-word;
            overflow-wrap: anywhere;
            line-height: 1.2;
        }


        /* sort header button */
        .sort-header-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .08em;
            cursor: pointer;
            padding: 0;
            display: inline-flex;
            flex-wrap: wrap;
            align-items: flex-end;
            justify-content: flex-end;
            gap: 2px;
            transition: color .15s;
            white-space: normal;
        }

        .sort-header-btn:hover {
            color: var(--accent);
        }

        .sort-icon {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
        }

        .trade-table td {
            padding: 6px 8px;
            border-bottom: 1px solid var(--border);
            color: var(--text);
            word-break: break-word;
            overflow-wrap: anywhere;
            text-align: center;
            min-width: 50px;
        }

        .trade-table tbody tr td.ath-fep-ratio {
            background-color: var(--bg-ath-fep-ratio);
            color: var(--ath-fep-ratio);
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            border-left: 1px solid var(--ath-fep-ratio);
            border-right: 1px solid var(--ath-fep-ratio);

            display: flex;
            flex-direction: column;
        }

        .trade-table tbody tr td.current-fep-ratio {
            background-color: var(--bg-current-fep-ratio);
            color: var(--current-fep-ratio);
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            border-left: 1px solid var(--current-fep-ratio);
            border-right: 1px solid var(--current-fep-ratio);
        }

        .trade-table tbody tr td.ratio-cell {
            text-align: center;
            font-size: 12px;
            font-weight: 700;
        }

        .trade-table tbody tr:hover td {
            background: var(--hovered-column-bg);
        }

        .trade-table tbody tr td:first-child {
            border-left: 3px solid transparent;
        }

        .trade-table tbody tr.selected-row td {
            background: var(--selected-row-bg);
            color: var(--text);
        }

        .trade-table tbody tr.selected-row td:first-child {
            border-left-color: var(--primary);
            background: var(--selected-row-bg);
        }

        .trade-table tbody tr.selected-row:hover td {
            background: var(--selected-row-hover-bg);
        }

        .trade-table th:hover,
        .trade-table td:hover {
            background: var(--hovered-cell-bg);
            color: var(--text);
        }

        .trade-table th:hover {
            background: var(--hovered-column-bg);
        }

        .trade-table td:hover {
            box-shadow: inset 0 0 0 1px var(--hovered-cell-border);
        }

        /* State-driven cross-column hover (set by Yew state on th/td) */
        .trade-table th.col-hover,
        .trade-table td.col-hover {
            background: var(--hovered-column-bg);
        }

        /* Intersection: row is hovered AND cell is in the active column → brightest */
        .trade-table tbody tr:hover td.col-hover {
            background: var(--hovered-cell-bg);
            box-shadow: inset 0 0 0 1px var(--hovered-cell-border);
            color: var(--text);
        }

        .trade-table tbody tr:last-child td {
            border-bottom: none;
        }

        /* side badges */
        .side-buy {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(8, 153, 129, 0.15);
            color: var(--primary);
            font-weight: 700;
            font-size: 11px;
            letter-spacing: .04em;
            border: 1px solid var(--primary);
        }

        .side-sell {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(242, 54, 69, 0.15);
            color: var(--danger);
            font-weight: 700;
            font-size: 11px;
            letter-spacing: .04em;
            border: 1px solid var(--danger);
        }

        /* row number */
        .row-num {
            color: var(--text-dim);
            font-size: 11px;
        }

        /* address cells */
        .addr {
            font-family: var(--mono);
            cursor: default;
        }

        /* no data */
        .no-data {
            text-align: center !important;
            padding: 48px !important;
            color: var(--text-dim);
            font-family: var(--font) !important;
        }

        /* ── Pagination footer ────────────────────────────────────────── */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            padding: 10px 12px;
            background: var(--bg-table-header);
            border: 1px solid var(--border);
            border-top: 2px solid var(--primary);
            border-radius: 0 0 8px 8px;
            font-size: 12px;
            color: var(--text-mid);
        }

        .pagination button {
            background: var(--bg-panel);
            color: var(--text-mid);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 4px 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: border-color .15s, color .15s, background-color .15s;
        }

        .pagination button:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(8, 153, 129, 0.05);
        }

        .pagination button:disabled {
            opacity: .35;
            cursor: not-allowed;
        }

        .pagination span {
            color: var(--text-mid);
            min-width: 120px;
            text-align: center;
            font-family: var(--mono);
        }

        /* ── ATH/Entry multiplier badges ─────────────────────────────── */
        .mult-high,
        .mult-mid,
        .mult-low {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 11px;
            letter-spacing: .03em;
        }

        .mult-high {
            background: rgba(242, 54, 69, 0.15);
            color: var(--danger);
        }

        .mult-mid {
            background: rgba(244, 224, 122, 0.15);
            color: var(--warning);
        }

        .mult-low {
            background: rgba(8, 153, 129, 0.15);
            color: var(--primary);
        }

        /* ── Tokens page filter bar ───────────────────────────────────── */
        .tokens-filter-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .tokens-search {
            flex: 1;
            max-width: 360px;
            background: var(--bg-card);
            color: var(--text);
            border: 1px solid var(--primary);
            border-radius: 6px;
            padding: 7px 12px;
            font-size: 12px;
            font-family: var(--mono);
            outline: none;
            transition: border-color .15s, box-shadow .15s;
            font-weight: 500;
        }

        .tokens-search::placeholder {
            color: var(--text-dim);
        }

        .tokens-search:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(246, 151, 104, 0.2);
        }

        /* ── Buy / sell numeric cell colors ─────────────────────────── */
        .num-buy {
            color: var(--primary);
            font-weight: 600;
        }

        .num-sell {
            color: var(--danger);
            font-weight: 600;
        }

        /* ── Analysis score badges ────────────────────────────────────── */
        .score-high {
            color: var(--danger);
            font-weight: 700;
            font-family: var(--mono);
        }

        .score-mid {
            color: var(--warning);
            font-weight: 700;
            font-family: var(--mono);
        }

        .score-low {
            color: var(--primary);
            font-weight: 700;
            font-family: var(--mono);
        }

        /* ── Tab bar (Analysis page) ──────────────────────────────────── */
        .tab-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab-btn {
            padding: 6px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-mid);
            font-size: 13px;
            font-family: var(--font);
            cursor: pointer;
            transition: background .15s, color .15s, border-color .15s;
            font-weight: 500;
        }

        .tab-btn:hover {
            background: var(--bg-hover);
            color: var(--text);
            border-color: var(--primary);
        }

        .tab-btn.active {
            background: rgba(8, 153, 129, 0.1);
            border-color: var(--primary);
            color: var(--primary);
            font-weight: 700;
        }

        /* ── Indicator cell: long text truncated ─────────────────────── */
        .indicator-cell {
            max-width: 320px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-dim);
            font-size: 11px;
        }

        /* ── Token count badge ────────────────────────────────────────── */
        .token-count-badge {
            padding: 3px 10px;
            border-radius: 6px;
            background: rgba(8, 153, 129, 0.15);
            border: 1px solid var(--primary);
            font-size: 11px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: .05em;
            font-family: var(--mono);
        }

        /* ── Animations ───────────────────────────────────────────────── */
        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes glow-border {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(8, 153, 129, 0);
            }

            50% {
                box-shadow: 0 0 0 3px rgba(8, 153, 129, .2);
            }
        }

        @keyframes link-icon-in {
            from {
                opacity: 0;
                transform: translateX(-2px) translateY(2px);
            }

            to {
                opacity: .55;
                transform: translateX(0) translateY(0);
            }
        }

        @keyframes fade-highlight {
            0% {
                background-color: rgba(56, 189, 248, 0.35);
            }

            50% {
                background-color: rgba(56, 189, 248, 0.2);
            }

            100% {
                background-color: transparent;
            }
        }

        .updated-cell {
            animation: fade-highlight 0.85s ease;
        }

        .detail-row td {
            padding: 0;
            border: none;
            background: rgba(15, 23, 42, 0.88);
        }

        .token-detail-panel {
            max-height: 0px;
            overflow: hidden;
            padding: 0 18px;
            background: var(--bg-panel);
            border-radius: 0 0 8px 8px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
            color: var(--text);
            opacity: 0;
            transform: translateY(-6px) scale(0.995);
            transition: max-height 520ms cubic-bezier(.2, .9, .2, 1), opacity 420ms ease, padding 360ms ease, transform 480ms cubic-bezier(.2, .9, .2, 1);
        }

        .token-detail-panel-loading,
        .token-detail-panel-error,
        .token-detail-panel-empty {
            font-size: 13px;
            color: var(--text-mid);
        }

        .detail-row.open td .token-detail-panel {
            max-height: none;
            opacity: 1;
            padding: 10px 14px;
            transform: translateY(0) scale(1);
            box-shadow: 0 6px 24px rgba(2, 8, 23, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.02);
            height: auto;
            overflow: visible;
        }

        /* Selected row visual using transitions so deselect also animates */
        .trade-table tbody tr {
            transition: background 420ms cubic-bezier(.2, .9, .2, 1), box-shadow 420ms cubic-bezier(.2, .9, .2, 1);
        }

        .selected-row {
            background: rgba(2, 192, 118, 0.02);
            box-shadow: 0 14px 32px rgba(2, 192, 118, 0.06);
        }

        .symbol-cell {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }

        .symbol-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.02);
            color: var(--text);
            text-decoration: none;
            transition: background .12s, color .12s;
            font-size: 12px;
        }

        .symbol-link:hover {
            background: rgba(56, 189, 248, 0.12);
            color: var(--primary);
        }

        /* ── Table wrapper elevation ──────────────────────────────────── */
        .table-wrapper {
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4), 0 8px 32px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        /* ── Row hover: left accent bar ───────────────────────────────── */
        .trade-table tbody tr {
            transition: background .12s;
        }

        .trade-table tbody tr:hover td:first-child {
            border-left: 3px solid var(--primary);
        }

        .trade-table tbody tr.detail-row:hover td:first-child {
            border-left: none;
        }

        .trade-table tbody tr:hover td {
            background: var(--hovered-column-bg);
        }

        /* ── Solscan external links ───────────────────────────────────── */
        .addr a {
            color: var(--accent);
            text-decoration: none;
            display: inline-flex;
            align-items: baseline;
            gap: 3px;
            transition: color .15s;
        }

        .addr a::after {
            content: "↗";
            font-size: 9px;
            font-style: normal;
            opacity: .55;
            line-height: 1;
            animation: link-icon-in .25s ease both;
            transition: opacity .15s, transform .15s;
        }

        .addr a:hover {
            color: var(--primary);
        }

        .addr a:hover::after {
            opacity: 1;
            transform: translateX(1px) translateY(-1px);
        }

        /* ── Side badges ──────────────────────────────────────────────── */
        .side-buy,
        .side-sell {
            transition: transform .12s, box-shadow .12s, background-color .12s;
            cursor: default;
        }

        .side-buy:hover {
            transform: scale(1.1);
            background: rgba(8, 153, 129, 0.25);
            box-shadow: 0 0 12px rgba(8, 153, 129, 0.4);
        }

        .side-sell:hover {
            transform: scale(1.1);
            background: rgba(242, 54, 69, 0.25);
            box-shadow: 0 0 12px rgba(242, 54, 69, 0.4);
        }

        /* ── Nav link active indicator (dedup — defined above) ─────────── */
        .nav-link.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 8px;
            right: 8px;
            height: 2px;
            border-radius: 2px 2px 0 0;
            background: var(--accent);
            box-shadow: 0 0 8px rgba(2, 192, 118, .6);
        }

        /* ── Chain dot enhanced glow ──────────────────────────────────── */
        .tokens-search:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(246, 151, 104, 0.15);
        }

        /* ── Pagination buttons ───────────────────────────────────────── */
        .pagination button {
            transition: border-color .15s, color .15s, transform .12s, box-shadow .12s;
        }

        .pagination button:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-1px);
            box-shadow: 0 2px 10px rgba(8, 153, 129, 0.3);
        }

        .pagination button:active:not(:disabled) {
            transform: translateY(0);
        }

        /* ── Live badge animated glow ─────────────────────────────────── */
        .live-badge,
        .live-toggle-btn.live-toggle-active {
            animation: glow-border 2.5s ease-in-out infinite;
        }

        /* ── Chain dot enhanced glow ──────────────────────────────────── */
        .chain-dot {
            box-shadow: 0 0 6px var(--primary), 0 0 14px rgba(8, 153, 129, 0.4);
        }

        /* ── Token count badge fade in ────────────────────────────────── */
        .section-header {
            animation: fade-in-up .22s ease both;
        }

        /* ── Page body fade in ────────────────────────────────────────── */
        .page-body {
            animation: fade-in-up .25s ease both;
        }

        /* ── Table controls bar ───────────────────────────────────────── */
        .table-controls {
            transition: background .15s;
        }

        .page-size-label select {
            transition: border-color .15s;
            cursor: pointer;
        }

        .page-size-label select:hover {
            border-color: var(--accent);
        }

        /* Row action button */
        .row-actions {
            text-align: center;
            vertical-align: middle;
        }

        .row-select-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            color: var(--text);
            padding: 6px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: background .12s, transform .12s, color .12s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .row-select-btn:hover {
            background: rgba(56, 189, 248, 0.08);
            color: var(--primary);
            transform: translateY(-1px);
        }

        .instruction-snapshot {
            background: rgba(0, 0, 0, 0.12);
            border-radius: 8px;
            padding: 12px;
            font-size: 12px;
            line-height: 1.4;
            color: var(--text);
            max-height: 260px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .instruction-structure {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            align-items: start;
        }

        .instruction-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 12px;
            align-items: center;
        }

        .instruction-list {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            max-height: 240px;
            overflow: auto;
        }

        .instruction-list ol {
            margin-left: 14px;
        }

        .instruction-list li {
            margin: 6px 0;
            font-size: 13px;
            color: var(--text);
            white-space: pre-wrap;
        }

        .instruction-text-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow-y: auto;
        }

        .instruction-text-item {
            font-size: 10px;
            text-align: left;
            color: var(--text);
            padding: 3px 5px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.02);
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
            border-left: 2px solid rgba(255, 255, 255, 0.08);
        }

        /* ══ Analysis Tokens Page ══════════════════════════════════════════ */

        /* ── Ratio colour scale ──────────────────────────────────────────── */
        .ratio-moon {
            color: #f23645;
            font-weight: 800;
        }

        .ratio-high {
            color: #f69768;
            font-weight: 700;
        }

        .ratio-good {
            color: #f4e07a;
            font-weight: 700;
        }

        .ratio-mid {
            color: #089981;
            font-weight: 600;
        }

        .ratio-low {
            color: #4c7ef0;
            font-weight: 500;
        }

        .ratio-flat {
            color: #555;
            font-weight: 400;
        }

        /* ── Age colour scale ────────────────────────────────────────────── */
        .age-fresh {
            color: #f23645;
            font-weight: 600;
        }

        /* < 1 h  */
        .age-recent {
            color: #f4e07a;
            font-weight: 600;
        }

        /* < 24 h */
        .age-normal {
            color: #089981;
        }

        /* < 7 d  */
        .age-old {
            color: #555;
        }

        /* > 7 d  */

        /* ── Migrated indicator ──────────────────────────────────────────── */
        .migrated-yes {
            color: #089981;
            font-weight: 700;
        }

        .migrated-no {
            color: #3a3a3a;
        }

        /* ── Ratio column background tint ────────────────────────────────── */
        .ath-fep-col {
            background: rgba(244, 224, 122, 0.04) !important;
        }

        .cur-fep-col {
            background: rgba(79, 206, 240, 0.04) !important;
        }

        /* ── Key th highlight ───────────────────────────────────────────── */
        .th-ath-fep {
            background: rgba(244, 224, 122, 0.06) !important;
        }

        .th-cur-fep {
            background: rgba(79, 206, 240, 0.06) !important;
        }

        .th-row-num {
            width: 40px;
            text-align: center;
        }

        .th-action {
            width: 48px;
        }

        /* ── Ratio cell (dual-line: Nx / N%) ─────────────────────────────── */
        .ratio-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
        }

        .ratio-main {
            font-weight: 700;
            font-size: 12px;
        }

        .ratio-sub {
            font-size: 10px;
            opacity: .65;
        }

        /* ══ Stat cards (detail panel) ═════════════════════════════════════ */
        .stat-card {
            display: grid;
            gap: 2px;
            padding: 4px 6px;
            min-height: 40px;
            height: 50px;
            box-sizing: border-box;
            align-content: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            transition: border-color .15s;
        }

        .stat-card:hover {
            border-color: rgba(255, 255, 255, 0.1);
        }

        .stat-label {
            font-size: 9px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: .08em;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* stat value base + colour variants */
        .sv {
            font-size: 14px;
            color: var(--text);
            font-weight: 500;
            word-break: break-all;
            font-family: var(--mono);
        }

        .sv-lg {
            font-size: 16px !important;
            font-weight: 600 !important;
            letter-spacing: .01em;
        }

        .sv-primary {
            color: var(--primary);
            font-weight: 600;
        }

        .sv-warning {
            color: var(--warning);
            font-weight: 600;
        }

        .sv-danger {
            color: var(--danger);
            font-weight: 700;
        }

        .sv-info {
            color: var(--info);
            font-weight: 600;
        }

        .sv-accent {
            color: var(--accent);
            font-weight: 700;
        }

        .sv-muted {
            color: var(--text-dim);
        }

        .sv-bold {
            font-weight: 800 !important;
        }

        .sv-addr {
            color: var(--accent);
            text-decoration: none;
        }

        .sv-addr:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        /* ── Stat grid layouts ───────────────────────────────────────────── */
        .stat-grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
        }

        .stat-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        .stat-grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        /* ── Address cards ───────────────────────────────────────────────── */
        .addr-card {
            padding: 5px 8px;
        }

        .addr-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
        }

        .addr-text {
            font-size: 10px;
            color: var(--text-mid);
            font-family: var(--mono);
            cursor: pointer;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: color .15s;
        }

        .addr-text:hover {
            color: var(--text);
        }

        .addr-copied {
            color: var(--primary) !important;
            font-weight: 600;
        }

        .addr-actions {
            display: flex;
            align-items: center;
            gap: 3px;
            flex-shrink: 0;
        }

        .addr-action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border: none;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            cursor: pointer;
            color: var(--text-dim);
            font-size: 9px;
            font-weight: 700;
            text-decoration: none;
            transition: background .15s, color .15s;
            padding: 0;
            line-height: 1;
        }

        .addr-action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
        }

        .addr-action-ok {
            color: var(--primary);
            background: rgba(2, 192, 118, 0.12);
        }

        .addr-gmgn {
            color: #00c97a;
        }

        .addr-gmgn:hover {
            color: #00f0a0 !important;
            background: rgba(0, 201, 122, 0.15) !important;
        }

        .addr-solscan {
            color: #9945ff;
        }

        .addr-solscan:hover {
            color: #b87cff !important;
            background: rgba(153, 69, 255, 0.15) !important;
        }

        /* ── Detail panel structure ──────────────────────────────────────── */
        .detail-panel-inner {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .detail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .detail-title-group {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .detail-symbol {
            font-size: 15px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: .02em;
        }

        .detail-token-name {
            font-size: 12px;
            color: var(--text-mid);
            font-weight: 400;
        }

        .detail-status-badge {
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .06em;
        }

        .detail-status-migrated {
            background: rgba(8, 153, 129, 0.12);
            border: 1px solid rgba(8, 153, 129, 0.3);
            color: var(--primary);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 3px 9px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .05em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .status-true {
            background: rgba(52, 199, 89, 0.16);
            border: 1px solid rgba(52, 199, 89, 0.28);
            color: #34c759;
        }

        .status-false {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-dim);
        }

        .detail-status-bonding {
            background: rgba(76, 126, 240, 0.1);
            border: 1px solid rgba(76, 126, 240, 0.25);
            color: var(--info);
        }

        .detail-section {
            display: grid;
            gap: 5px;
        }

        .detail-body {
            display: flex;
            align-items: flex-start;
            gap: 0;
        }

        .detail-left {
            flex: 1;
            min-width: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .detail-body-divider {
            width: 1px;
            background: rgba(255, 255, 255, 0.07);
            align-self: stretch;
            flex-shrink: 0;
            margin: 0 10px;
        }

        .detail-right {
            width: 185px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 5px;
            overflow-y: auto;
            max-height: 300px;
        }

        .detail-section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            min-height: 16px;
            font-size: 9px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: .12em;
            font-weight: 700;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.4;
        }

        .detail-copy-btn,
        .form-action-btn {
            width: 34px;
            height: 34px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background .15s, border-color .15s;
        }

        .detail-copy-btn:hover,
        .form-action-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .detail-copy-ok {
            color: var(--primary);
            border-color: rgba(2, 192, 118, 0.3);
            background: rgba(2, 192, 118, 0.12);
        }

        .form-field-label-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .form-input-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-input-row .form-input {
            flex: 1;
        }

        .detail-loading {
            padding: 20px;
            text-align: center;
        }

        .token-detail-panel-empty {
            padding: 20px;
            text-align: center;
        }

        /* ── Tokens page header & toolbar ────────────────────────────────── */
        .tokens-page-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .tokens-title-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .tokens-page-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--text);
        }

        .tokens-toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        /* ── Column options panel ──────────────────────────────────────────── */
        .tokens-options-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }

        .options-toggle-btn {
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .06em;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 5px;
            color: var(--text-dim);
            cursor: pointer;
            transition: background .15s, border-color .15s, color .15s;
        }

        .options-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.07);
            color: var(--text);
            border-color: rgba(255, 255, 255, 0.14);
        }

        .options-toggle-btn.options-toggle-active {
            background: rgba(20, 184, 166, 0.12);
            border-color: rgba(20, 184, 166, 0.35);
            color: var(--primary);
        }

        .col-options-panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .col-options-header {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .14em;
            color: var(--text-dim);
            margin-bottom: 14px;
        }

        .col-options-groups {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .col-opt-group {
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 10px 12px;
        }

        .col-opt-group-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-dim);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .col-opt-group-body {
            display: grid;
            gap: 8px;
        }

        .col-opt-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text);
            cursor: pointer;
            user-select: none;
            padding: 6px 4px;
            border-radius: 6px;
            transition: background .15s;
        }

        .col-opt-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .col-opt-item input[type="checkbox"] {
            accent-color: var(--primary);
            width: 14px;
            height: 14px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .col-opt-item span {
            white-space: nowrap;
        }

        /* ── Filter panel ──────────────────────────────────────────────────── */
        .filter-panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 8px;
            padding: 10px 14px 12px;
            margin-bottom: 8px;
        }

        .filter-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .filter-panel-title {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .12em;
            color: var(--text-dim);
        }

        .filter-clear-btn {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-dim);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            transition: color .15s;
        }

        .filter-clear-btn:hover {
            color: var(--danger);
        }

        /* ── Groups ─────────────────────────────────────────────────────── */
        .filter-group {
            margin-bottom: 8px;
        }

        .filter-group:last-child {
            margin-bottom: 0;
        }

        .filter-group-label {
            font-size: 8px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .14em;
            color: var(--text-dim);
            opacity: .7;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }

        .filter-group-label::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.05);
        }

        .filter-group-body {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 20px;
            align-items: center;
        }

        /* ── Items ──────────────────────────────────────────────────────── */
        .filter-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-dim);
            white-space: nowrap;
        }

        .filter-range {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .filter-input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            color: var(--text);
            font-size: 11px;
            font-family: var(--mono);
            padding: 3px 5px;
            width: 70px;
            outline: none;
        }

        .filter-input-wide {
            width: 140px;
        }

        .filter-input:focus {
            border-color: rgba(20, 184, 166, 0.4);
        }

        .filter-input::-webkit-inner-spin-button,
        .filter-input::-webkit-outer-spin-button {
            opacity: 0.4;
        }

        .filter-sep {
            font-size: 10px;
            color: var(--text-dim);
            flex-shrink: 0;
        }

        .filter-select {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            color: var(--text);
            font-size: 11px;
            padding: 3px 5px;
            width: 80px;
            outline: none;
            cursor: pointer;
        }

        .filter-select:focus {
            border-color: rgba(20, 184, 166, 0.4);
        }

        .filter-select option {
            background: var(--bg-card);
        }

        .tokens-search {
            flex: 1;
            min-width: 200px;
            max-width: 340px;
            padding: 7px 12px;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: var(--text);
            font-size: 13px;
            outline: none;
            transition: border-color .15s;
        }

        .tokens-search:focus {
            border-color: var(--primary);
        }

        .tokens-search::placeholder {
            color: var(--text-dim);
        }

        /* ══ Strategy page ═════════════════════════════════════════════════ */

        /* ── Page header ─────────────────────────────────────────────────── */
        .strat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .strat-title-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .strat-toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        /* ── Add rule button ─────────────────────────────────────────────── */
        .add-rule-btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 7px 16px;
            background: rgba(8, 153, 129, 0.12);
            border: 1px solid var(--primary);
            border-radius: 6px;
            color: var(--primary);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .04em;
            cursor: pointer;
            transition: background .15s, box-shadow .15s, transform .12s;
        }

        .add-rule-btn:hover {
            background: rgba(8, 153, 129, 0.22);
            box-shadow: 0 0 10px rgba(8, 153, 129, 0.25);
            transform: translateY(-1px);
        }

        /* ── Table cell colour helpers ───────────────────────────────────── */
        .rule-name-cell {
            font-weight: 600;
            color: var(--text);
            font-family: var(--mono);
        }

        .num-col {
            font-family: var(--mono);
            color: var(--text);
        }

        .dim-col {
            font-family: var(--mono);
            color: var(--text-dim);
            font-size: 11px;
        }

        .tp-col {
            color: var(--green);
            font-weight: 700;
            font-family: var(--mono);
        }

        .sl-col {
            color: var(--red);
            font-weight: 700;
            font-family: var(--mono);
        }

        .labels-col {
            font-size: 11px;
            color: var(--text-dim);
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .status-col {
            text-align: center;
        }

        .actions-col {
            display: flex;
            align-items: center;
            gap: 5px;
            justify-content: center;
            white-space: nowrap;
        }

        /* ── Status pill (toggleable) ────────────────────────────────────── */
        .status-pill {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .06em;
            cursor: pointer;
            border: 1px solid transparent;
            transition: background .15s, box-shadow .15s, transform .1s;
        }

        .status-pill:hover {
            transform: scale(1.05);
        }

        .status-active {
            background: rgba(8, 153, 129, 0.12);
            border-color: rgba(8, 153, 129, 0.4);
            color: var(--green);
        }

        .status-inactive {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.1);
            color: var(--text-dim);
        }

        /* ── Row action buttons ──────────────────────────────────────────── */
        .act-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 3px 9px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            font-family: var(--mono);
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-dim);
            transition: background .12s, border-color .12s, color .12s, transform .1s;
        }

        .act-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.16);
            color: var(--text);
            transform: translateY(-1px);
        }

        .act-btn:disabled {
            opacity: .35;
            cursor: not-allowed;
        }

        .act-edit:hover:not(:disabled) {
            border-color: rgba(76, 126, 240, 0.5);
            color: var(--info);
        }

        .act-danger:hover:not(:disabled) {
            border-color: rgba(242, 54, 69, 0.5);
            color: var(--danger);
        }

        .act-sim:hover:not(:disabled) {
            border-color: rgba(8, 153, 129, 0.5);
            color: var(--primary);
        }

        .act-list:hover:not(:disabled) {
            border-color: rgba(147, 112, 219, 0.5);
            color: #9370db;
        }

        .act-list-active {
            border-color: rgba(147, 112, 219, 0.45) !important;
            color: #9370db !important;
            background: rgba(147, 112, 219, 0.08) !important;
        }

        .confirm-text {
            font-size: 11px;
            color: var(--danger);
            font-weight: 600;
            font-family: var(--mono);
        }

        /* ── State messages ──────────────────────────────────────────────── */
        .strat-state-msg {
            padding: 40px;
            text-align: center;
            color: var(--text-dim);
            font-size: 13px;
        }

        .inline-error {
            padding: 10px 14px;
            border-radius: 6px;
            background: rgba(242, 54, 69, 0.08);
            border: 1px solid rgba(242, 54, 69, 0.25);
            color: var(--danger);
            font-size: 12px;
            margin: 10px 0;
        }

        .inline-success {
            padding: 10px 14px;
            border-radius: 6px;
            background: rgba(39, 174, 96, 0.08);
            border: 1px solid rgba(39, 174, 96, 0.25);
            color: #27ae60;
            font-size: 12px;
            margin: 10px 0;
        }

        /* ── Simulation result ───────────────────────────────────────────── */
        .sim-loading {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            color: var(--text-dim);
            font-size: 13px;
        }

        .sim-spinner {
            display: inline-block;
            animation: spin 1s linear infinite;
            font-size: 16px;
            color: var(--primary);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .sim-result {
            margin-top: 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(8, 153, 129, 0.2);
            border-radius: 10px;
            overflow: hidden;
            animation: fade-in-up .2s ease both;
        }

        .sim-result-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: rgba(8, 153, 129, 0.07);
            border-bottom: 1px solid rgba(8, 153, 129, 0.15);
        }

        .sim-result-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: .02em;
        }

        .sim-close-btn {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 14px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: background .12s, color .12s;
        }

        .sim-close-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text);
        }

        .sim-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1px;
            background: rgba(255, 255, 255, 0.04);
            padding: 1px;
        }

        .sim-stat {
            background: var(--bg-panel);
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .sim-stat-label {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .1em;
            color: var(--text-dim);
        }

        .sim-stat-value {
            font-size: 18px;
            font-weight: 800;
            font-family: var(--mono);
            color: var(--text);
        }

        .sim-stat-sub {
            font-size: 11px;
            font-weight: 400;
            color: var(--text-dim);
        }

        /* ── Simulation summary card (above rules table) ───────────────── */
        .sim-summary-card {
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(8, 153, 129, 0.25);
            border-radius: 10px;
            overflow: hidden;
            animation: fade-in-up .2s ease both;
        }

        .sim-summary-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: rgba(8, 153, 129, 0.09);
            border-bottom: 1px solid rgba(8, 153, 129, 0.18);
        }

        .sim-summary-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: .02em;
        }

        .sim-summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 1px;
            background: rgba(255, 255, 255, 0.04);
            padding: 1px;
        }

        .sim-summary-stat {
            background: var(--bg-panel);
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .sim-summary-label {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .1em;
            color: var(--text-dim);
        }

        .sim-summary-value {
            font-size: 18px;
            font-weight: 800;
            font-family: var(--mono);
            color: var(--text);
        }

        /* ── Matched tokens panel ───────────────────────────────────────── */
        .matched-panel {
            margin-top: 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(147, 112, 219, 0.2);
            border-radius: 10px;
            overflow: hidden;
        }

        .matched-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: rgba(147, 112, 219, 0.06);
            border-bottom: 1px solid rgba(147, 112, 219, 0.12);
        }

        .matched-panel-title {
            font-size: 13px;
            font-weight: 700;
            color: #9370db;
            letter-spacing: .02em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .matched-count-badge {
            font-size: 10px;
            font-weight: 700;
            background: rgba(147, 112, 219, 0.15);
            color: #9370db;
            padding: 2px 8px;
            border-radius: 10px;
            font-family: var(--mono);
        }

        .matched-empty {
            padding: 24px;
            text-align: center;
            color: var(--text-dim);
            font-size: 13px;
        }

        .th-num {
            width: 36px;
            text-align: right;
        }

        .row-num {
            text-align: right;
            color: var(--text-dim);
            font-size: 11px;
            font-family: var(--mono);
        }

        /* ══ Modal ═════════════════════════════════════════════════════════ */
        body.modal-open {
            overflow: hidden;
        }

        .modal-overlay {
            position: fixed;
            height: calc(100vh - 46px);
            inset: 0;
            z-index: 200;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            display: flex;
            /* align-items: center; */
            justify-content: center;
            padding: 20px;
            animation: fade-in-overlay .18s ease both;
            overscroll-behavior: contain;
            box-sizing: border-box;
            overflow-y: auto;
        }

        @keyframes fade-in-overlay {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal {
            background: var(--bg-panel);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            /* max-height: calc(100vh - 40px); */
            height: fit-content;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.7);
            animation: modal-in .2s cubic-bezier(.2, .9, .2, 1) both;
        }

        @keyframes modal-in {
            from {
                opacity: 0;
                transform: translateY(8px) scale(.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .modal-header h2 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
        }

        .modal-header button {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background .12s, color .12s;
        }

        .modal-header button:hover {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text);
        }

        .modal-body {
            padding: 20px;
            overflow: auto;
        }

        /* ══ Rule form ══════════════════════════════════════════════════════ */
        .rule-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .rule-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 16px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-field-full {
            grid-column: 1 / -1;
        }

        .form-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--text-dim);
        }

        .form-opt {
            font-size: 9px;
            font-weight: 500;
            text-transform: none;
            letter-spacing: 0;
            color: var(--text-dim);
            opacity: .65;
        }

        .form-input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: var(--text);
            font-size: 13px;
            font-family: var(--mono);
            padding: 8px 10px;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
            width: 100%;
        }

        .form-input::placeholder {
            color: var(--text-dim);
            opacity: .6;
        }

        .form-input:focus {
            border-color: var(--primary);
