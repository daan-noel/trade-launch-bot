[package]
name = "ingest-laserstream"
version = "0.1.0"
edition = "2021"
description = "Yellowstone/LaserStream gRPC ingest transport for the meme-trading backend."

[lib]
name = "ingest_laserstream"
path = "src/lib.rs"

[dependencies]
backend-core = { path = "../backend-core" }

# gRPC transport
tonic = { version = "0.10", features = ["tls", "tls-webpki-roots"] }
prost = "0.12"
tokio-stream = "0.1"

# Runtime + utils
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
anyhow = "1"

# Shared state deps
dashmap = "4.0"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive", "rc"] }

# Database
sqlx = { version = "0.6", features = ["runtime-tokio-rustls", "postgres", "json", "chrono", "uuid"] }

# Futures utilities (db_writer uses buffer_unordered)
futures-util = "0.3"

# Base58 / Base64 (adapter, decoder)
bs58 = "0.5"
base64 = "0.22"

# Borsh deserialization (pump.fun on-chain structs)
borsh = { version = "1", features = ["derive"] }

# UUID (db_writer)
uuid = { version = "1", features = ["v4", "serde"] }

# Solana SDK for adapter_rpc (bincode decode of VersionedTransaction)
solana-sdk = "1.17.27"
bincode = "1.3"
