[package]
name = "ingest-laserstream"
version = "0.1.0"
edition = "2021"
description = "Yellowstone/LaserStream gRPC ingest transport — standalone drop-in (no workspace deps)."

[lib]
name = "ingest_laserstream"
path = "src/lib.rs"

[features]
default = []
# Enables IngestEvent::RawTx and build_raw_blob (serde_json synthesis of the
# Helius-shaped raw-tx blob for persistence in raw_transactions.raw_data).
raw-json = ["dep:serde_json"]
# Enables rpc_to_protobuf (backfill: RPC base64 → SubscribeUpdateTransaction).
# Requires solana-sdk + bincode (already in the dep list for PDA derivation).
rpc-backfill = []

[dependencies]
# gRPC transport
tonic = { version = "0.10", features = ["tls", "tls-webpki-roots"] }
prost = "0.12"
tokio-stream = "0.1"

# Runtime + utils
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = "1"

# Shared state deps
dashmap = "4.0"
chrono = { version = "0.4", features = ["serde"] }

# Base58 / Base64 (decode, backfill)
bs58 = "0.5"
base64 = "0.22"

# Borsh deserialization (pump.fun on-chain structs)
borsh = { version = "1", features = ["derive"] }

# Solana SDK: PDA derivation in pool.rs + VersionedTransaction decode in backfill.rs
solana-sdk = "1.17.27"
bincode = "1.3"

# serde_json: optional, only needed for raw-json feature
serde_json = { version = "1", optional = true }
