# ---------------------------------------------------------------------------
# Full stack: postgres + Rust backend + nginx (frontend static + /api proxy).
#
# Up / update:   docker compose up -d --build
# Logs:          docker compose logs -f backend
# Stop:          docker compose down            (data persists in the pgdata volume)
#
# Secrets/config come from a local .env file (see .env.example). Only nginx is
# published; postgres and backend stay on the internal network.
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    # Server tuning. Two problem classes were observed and addressed here:
    #
    # 1. "pool timed out" — the default max_connections=100 was below the three app
    #    pools combined (DB_MAX + DB_API + DB_BATCH = 112) plus external clients +
    #    superuser reserve. Lifted to 300 so the pools always have room.
    #
    # 2. Disk thrashing — Postgres runs co-located on a small (~4GB) box, and the
    #    `trades`/`raw_transactions` partitions outgrow the default 128MB/256MB cache,
    #    so queries re-read table data from EBS instead of RAM (observed: 100s of GB
    #    of block reads). That held connections for seconds → pool exhaustion → ingest
    #    wedge → liveness-watchdog restart. The settings below keep the working set in
    #    cache and bias the planner toward index scans (it's on SSD/EBS, not spinning
    #    disk), which is what stops the re-reads:
    #      - shared_buffers       — actual in-process page cache (the big lever)
    #      - effective_cache_size — planner hint of total cache (not allocated)
    #      - random_page_cost 1.1 — SSD: make index scans cheap so it stops seq-scanning
    #      - effective_io_concurrency — let bitmap heap scans issue concurrent reads
    #      - max_parallel_workers_per_gather=1 — only 2 vCPU shared with the backend,
    #        so cap parallel query workers to avoid stealing cores from ingest
    #      - checkpoint/WAL spread — avoid write-I/O spikes that stall reads
    #    Every value is env-overridable so it can be dialed per box size without
    #    editing this file. If the box shows memory pressure, drop shared_buffers to
    #    768MB (and effective_cache_size to ~1.5GB).
    command:
      - "postgres"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-300}"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}"
      - "-c"
      - "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}"
      - "-c"
      - "work_mem=${POSTGRES_WORK_MEM:-16MB}"
      - "-c"
      - "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}"
      - "-c"
      - "random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.1}"
      - "-c"
      - "effective_io_concurrency=${POSTGRES_EFFECTIVE_IO_CONCURRENCY:-200}"
      - "-c"
      - "max_parallel_workers_per_gather=${POSTGRES_MAX_PARALLEL_PER_GATHER:-1}"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "min_wal_size=80MB"
      - "-c"
      - "wal_compression=on"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-meme_bot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Publish postgres so an external client (e.g. Navicat) can connect.
    # Override the host port via POSTGRES_HOST_PORT in .env if 5432 is taken.
    ports:
      - "${POSTGRES_HOST_PORT:-5555}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-meme_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # tini as PID 1: forwards SIGTERM to the binary (the kernel ignores SIGTERM for
    # PID 1 with no handler), so `docker stop`/redeploy kills it promptly instead of
    # waiting the 10s grace period then SIGKILL mid-trade.
    init: true
    env_file: .env
    environment:
      # These OVERRIDE anything in .env (compose `environment` wins over env_file):
      # - bind on all interfaces so nginx can reach it (code default is 127.0.0.1)
      # - point at the postgres service, not localhost
      HOST: 0.0.0.0
      PORT: 8081
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-meme_bot}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend-react/Dockerfile
      args:
        # Empty => SPA uses relative /api, proxied to backend by nginx.
        VITE_API_BASE: ""
        VITE_POLL_INTERVAL_MS: ${VITE_POLL_INTERVAL_MS:-5000}
    restart: unless-stopped
    environment:
      # nginx injects this as the upstream `Authorization: Bearer` header so the
      # backend's fail-closed auth accepts proxied /api calls. envsubst (the nginx
      # image entrypoint) substitutes it into default.conf.template at start;
      # the filter keeps it from clobbering nginx's own $-variables.
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:?API_AUTH_TOKEN is required (see .env.example)}
      NGINX_ENVSUBST_FILTER: API_AUTH_TOKEN
    ports:
      - "80:80"      # redirects to HTTPS
      - "443:443"    # TLS (self-signed for local/testing; see nginx/tls/)
    depends_on:
      - backend

volumes:
  pgdata:
