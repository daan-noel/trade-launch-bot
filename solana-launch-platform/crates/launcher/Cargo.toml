[package]
name = "launcher"
version.workspace = true
edition.workspace = true
description = "Launch orchestrator: token-create + dev-buy + bundler seam via the borrowed pump-trader as the pump.fun venue adapter. LIVE ONLY — never a lab dep."

[lib]
name = "launcher"
path = "src/lib.rs"

[dependencies]
platform-core = { path = "../platform-core" }
# Borrowed execution layer (standalone). The launch dev-buy IS a pump-trader buy;
# the create builder is a targeted extension we own. LIVE-only.
pump-trader.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sqlx.workspace = true
uuid.workspace = true
chrono.workspace = true
aes-gcm.workspace = true
zeroize.workspace = true
sha2.workspace = true
base64.workspace = true
bs58.workspace = true
rand.workspace = true
solana-sdk.workspace = true
solana-client.workspace = true
bincode = "1.3"
reqwest = { version = "0.11", features = ["json", "multipart"] }
