# ---------------------------------------------------------------------------
# Local Postgres + TimescaleDB for the launch platform.
#
# Up:    docker compose up -d
# Logs:  docker compose logs -f postgres
# Down:  docker compose down            (data persists in the pgdata volume)
#
# Host port defaults to 5556 so it coexists with the sibling meme-trading stack
# (which uses 5555). Override via POSTGRES_HOST_PORT in .env.
#
# Monorepo: image builds use context = repo root (the single cargo workspace +
# shared/ crates). `slp-lab` stays workstation-only (duckdb/arrow/parquet) and is
# never containerised — see the SLP CLAUDE.md "Dep partition".
# ---------------------------------------------------------------------------

services:
  postgres:
    container_name: slp-postgres
    # Standard TimescaleDB image (NOT -ha: the -ha image relocates PGDATA and the
    # volume mount below would not persist). Same choice as meme-trading.
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    # Tuning tuned for the 2vCPU/4GB EC2 target (carried from meme-trading): keep
    # max_connections low (each backend ~26MB vs the 1GB buffer pool), bias the
    # planner toward index scans on SSD/EBS, cap parallel workers off the ingest
    # cores. Every value is env-overridable to dial per box size.
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=timescaledb"
      - "-c"
      - "timescaledb.max_background_workers=${TIMESCALEDB_MAX_BG_WORKERS:-2}"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-80}"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}"
      - "-c"
      - "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}"
      - "-c"
      - "work_mem=${POSTGRES_WORK_MEM:-16MB}"
      - "-c"
      - "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}"
      - "-c"
      - "random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.1}"
      - "-c"
      - "effective_io_concurrency=${POSTGRES_EFFECTIVE_IO_CONCURRENCY:-200}"
      - "-c"
      - "max_parallel_workers_per_gather=${POSTGRES_MAX_PARALLEL_PER_GATHER:-1}"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "min_wal_size=80MB"
      - "-c"
      - "wal_compression=on"
      - "-c"
      # Safe here: PG stays up when the app restarts, and the gRPC feed is
      # replayable — worst-case power-loss drops <1 WAL buffer of commits.
      - "synchronous_commit=off"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-launch_platform}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5556}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-launch_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # LIVE bin (`slp-live`): ingest + launcher + trading + thin HTTP API. The
  # analysis bin (`slp-lab`) is workstation-only and never built here. Image
  # builds from the monorepo root (shared/ crates live outside this folder).
  slp-live:
    container_name: slp-live
    build:
      context: ..
      dockerfile: solana-launch-platform/crates/slp-live/Dockerfile
    restart: unless-stopped
    # tini as PID 1: forwards SIGTERM so `docker stop`/redeploy kills it promptly.
    init: true
    env_file: .env
    environment:
      # OVERRIDE .env (compose `environment` wins): bind all interfaces + point
      # at the postgres service, not localhost.
      HOST: 0.0.0.0
      PORT: 8081
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-launch_platform}
    # Distinct host port from the meme-trading stack (which publishes 8081 in dev).
    ports:
      - "${SLP_LIVE_HOST_PORT:-8091}:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
