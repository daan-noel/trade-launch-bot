[package]
name = "live"
version = "0.1.0"
edition = "2021"

[lib]
name = "live"
path = "src/lib.rs"

[[bin]]
name = "live"
path = "src/main.rs"

[dependencies]
trading_core = { path = "../trading_core" }
ingest-laserstream = { path = "../../shared/ingest-laserstream", features = ["raw-tx", "rpc-backfill"] }
# `probe`/`claim` are off by default in the crate; the live box uses both.
pump-trader = { path = "../../shared/pump-trader", features = ["probe", "claim"] }

# Tokio
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# Web framework (for handlers + HTTP server)
actix-web = "4"
actix-cors = "0.7"

# Database
sqlx = { version = "0.6", features = ["runtime-tokio-rustls", "postgres", "json", "chrono", "uuid", "migrate"] }

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errors
anyhow = "1"

# Shared state
dashmap = "4.0"

# Config
dotenvy = "0.15"

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async trait
async-trait = "0.1"

# Solana (needed by strategies and trader)
solana-sdk = "1.17.27"

# Encoding (strategies use these for tx construction)
bs58 = "0.5"
base64 = "0.22"
bincode = "1.3"

# Reqwest
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# Futures
futures-util = "0.3"
