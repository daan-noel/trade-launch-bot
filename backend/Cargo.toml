[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[profile.dev]
debug = true

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
actix-web = "4"
actix-cors = "0.7"

# WebSocket client
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "json", "chrono", "uuid", "migrate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config / env
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Shared state
dashmap = "5"

# Async trait
async-trait = "0.1"

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1"
anyhow = "1"

# URL building
url = "2"

# Base58 decoding (Solana instruction data)
bs58 = "0.5"

# Base64 decoding (Pump.fun "Program data:" log events are base64)
base64 = "0.22"

# Borsh deserialisation (Pump.fun on-chain structs, Compute Budget instruction)
borsh = { version = "1", features = ["derive"] }


reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }