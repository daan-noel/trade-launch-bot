[package]
name = "backend"
version = "0.1.0"
edition = "2021"


[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
actix-web = "4"
actix-cors = "0.7"

futures-util = "0.3"

# Database
sqlx = { version = "0.6", features = ["runtime-tokio-rustls", "postgres", "json", "chrono", "uuid", "migrate"] }

# Serialization
# `rc` enables Serialize/Deserialize for Arc<T> — events embed Arc<RawTransaction>
# so a multi-trade tx clones a pointer per leg, not the full result JSON.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

# Config / env
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Shared state
dashmap = "4.0"

# Async trait
async-trait = "0.1"

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1"
anyhow = "1"

# URL building
url = "2"

# Base58 decoding (Solana instruction data)
bs58 = "0.5"

# Base64 decoding (Pump.fun "Program data:" log events are base64)
base64 = "0.22"

# Borsh deserialisation (Pump.fun on-chain structs, Compute Budget instruction)
borsh = { version = "1", features = ["derive"] }

# Solana on-chain transaction construction and RPC
solana-client = "1.17.27"
solana-sdk = "1.17.27"

# Token program account initialization helpers
spl-associated-token-account = "2.2"
spl-token = "=4.0.0"
spl-token-2022 = "=1.0.0"
spl-memo = "=4.0.0"

# Random tip account selection
rand = "0.8"

# Transaction encoding for Helius sender
bincode = "1.3"

reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# Yellowstone gRPC (Helius LaserStream) ingest transport.
# Codegen is committed under src/ingest_laserstream/generated/ (no build-time
# protoc); these are the runtime deps the generated bindings + client need.
tonic = { version = "0.10", features = ["tls", "tls-webpki-roots"] }
prost = "0.12"
tokio-stream = "0.1"

# Standalone Pump.fun trader, extracted for reuse across projects.
pump-trader = { path = "../pump-trader" }

# Shared core: config, models, storage, core services/state, api framework.
backend-core = { path = "../backend-core" }

# Param-sweep / backtest engine (src/sweep): data-parallel sweep over
# tokens, columnar Parquet corpus + result emit for the Python scoring layer.
rayon = "1"
arrow = "53"
parquet = "53"
# Cross-platform process RSS read (win32 GetProcessMemoryInfo / Linux /proc /
# macOS task_info) for the sweep memory observability milestones (Phase 0.3).
memory-stats = "1"
