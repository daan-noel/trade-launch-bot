[package]
name = "forge-live"
version.workspace = true
edition.workspace = true
description = "LIVE box (ships to EC2): ingest + launcher + trading + thin HTTP. The ingest host-adapter is now the in-crate `src/ingest/` module (was the ingest-host crate); links launcher (+ pump-trader + ingest-laserstream). MUST NOT link lake / duckdb / arrow / parquet."

[[bin]]
name = "forge-live"
path = "src/main.rs"

[dependencies]
platform-core = { path = "../core", package = "forge-core" }
launcher      = { path = "../launcher", package = "forge-launcher" }
# Ingest host-adapter (src/ingest/) — folded in from the former ingest-host crate;
# it bridges the borrowed ingest-laserstream transport onto platform-core rows.
# `rpc-backfill` adds the getSignaturesForAddress/getTransaction pager +
# rpc_to_protobuf that the keystore-restore backfill (src/restore/) drives.
ingest-laserstream = { workspace = true, features = ["rpc-backfill"] }
# Shared fail-closed bearer-auth middleware — same gate hunter's real-money bins
# use; forge-live moves treasury SOL so its mutating routes get it too.
http-auth.workspace = true
tokio.workspace = true
actix-web.workspace = true
# SSE push bus: `stream::unfold` over the broadcast receiver for `/api/stream`
# (same version hunter-core pins).
futures-util = "0.3"
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
dotenvy.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
uuid.workspace = true
chrono.workspace = true
bs58 = "0.5"
reqwest = { version = "0.11", features = ["json"] }
# NOTE: `lake` is intentionally absent. Adding it here drags DuckDB/arrow/parquet
# onto the 2vCPU/4GB EC2 box — verify with `cargo tree -p forge-live` (no duckdb).
