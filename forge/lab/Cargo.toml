[package]
name = "forge-lab"
version.workspace = true
edition.workspace = true
description = "ANALYSIS box (workstation only): lake export + sweeps + backtests + wallet analytics + thin HTTP. The Parquet/DuckDB cold tier is now the in-crate `src/lake/` module (was the lake crate). MUST NOT link pump-trader / ingest-laserstream / launcher."

[[bin]]
name = "forge-lab"
path = "src/main.rs"

[dependencies]
platform-core = { path = "../core", package = "forge-core" }
tokio.workspace = true
actix-web.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
dotenvy.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
# NOTE: no ingest-host / launcher / pump-trader / ingest-laserstream. Verify with
# `cargo tree -p lab` (no pump-trader / ingest-laserstream / tonic). lab runs with
# NO signing keys and NO gRPC.
