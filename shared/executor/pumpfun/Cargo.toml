[package]
name = "executor-pumpfun"
version = "0.1.0"
edition = "2021"
description = "The pump.fun VENUE for the executor stack: protocol consts, discriminators, variant catalog, ix builders, curve+AMM pricing. Wraps `executor-core`'s venue-agnostic send engine (via Deref) as `PumpFunTrader`."

# The lib name stays `pump_trader` so every `use pump_trader::…` consumer + the
# `pump_trader::{constants,protocol,types}` paths keep resolving unchanged — this
# crate is the back-compat FAÇADE, re-exporting the engine items from
# `executor-core` alongside its own pump venue API.
[lib]
name = "pump_trader"
path = "src/lib.rs"

[features]
# Off-hot-path tools, off by default so a minimal consumer compiles only the
# buy/sell core. `live` enables both. The features are forwarded to executor-core
# (whose send/sim harness carries the matching `probe`/`claim` gates).
default = []
probe = ["executor-core/probe"]
claim = ["executor-core/claim"]

[dependencies]
# The venue-agnostic send engine (sign/send/confirm/nonce/tip/retry/sim + the
# `Venue` seam + `TradeError`/`TraderConfig`). This crate wraps it as the pump.fun
# venue and re-exports its public items through the `pump_trader` façade.
executor-core = { path = "../core" }

# Tier-1 protocol invariants live in `src/protocol.rs` (const Pubkeys via the
# `pubkey!` macro). `src/constants.rs` is a thin back-compat shim for external
# string consumers.

# Async runtime (consumer provides the runtime; the trader spawns background tasks).
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }

# Error handling — the boundary type is re-exported from executor-core, but the
# venue still derives its own via thiserror where needed.
thiserror = "1"

# Serialization (WalletHolding / TokenBalance derive Serialize)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"

# Encodings for transaction submission
base64 = "0.22"
bincode = "1.3"
# base58: decode instruction data (swap discriminator) when reading a recent
# on-chain swap to recover the per-coin fee-share marker account.
bs58 = "0.5"

# Random Jito tip-account selection (venue picks the tip account at construction).
rand = "0.8"

# Concurrent maps for the per-token / reserve caches. Sharded internally, so the
# WS-ingest writer and the trade readers no longer contend on one global mutex.
# Pinned to 4.0 to match the workspace (solana 1.17 already pulls dashmap 4.0.2).
dashmap = "4.0"

# HTTP client for the Helius sender JSON-RPC
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# Solana on-chain transaction construction and RPC
solana-client = "1.17.27"
solana-sdk = "1.17.27"
# Decode the post-execution account states simulateTransaction returns (the
# `accounts` field) into balances/token amounts for the simulation engine.
solana-account-decoder = "1.17.27"

# Token program account-initialization helpers (versions pinned to match solana 1.17)
spl-associated-token-account = "2.2"
spl-token = "=4.0.0"
spl-token-2022 = "=1.0.0"

[dev-dependencies]
# Mock TCP sender endpoints for the multi-endpoint fan-out test. Adds only the
# socket + io features needed by the test; not compiled for downstream.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
