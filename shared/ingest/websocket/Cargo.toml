[package]
name = "ingest-websocket"
version = "0.1.0"
edition = "2021"
description = "WebSocket ingest transport — empty scaffold sibling to ingest-core. Flesh out only if moving off gRPC; when built it consumes the same ingest-core IngestVenue/IngestEvent seam so a venue stays transport-agnostic. Not yet implemented."

[lib]
name = "ingest_websocket"
path = "src/lib.rs"

[dependencies]
# Transport-agnostic ingest contract (IngestHandles, TraderHook) + shared models.
trading_core = { path = "../../../hunter/core", package = "hunter-core" }

# Runtime + channel types named in the spawn signature.
tokio = { version = "1", features = ["full"] }

# Hot-path Postgres pool type in the spawn signature.
sqlx = { version = "0.6", features = ["runtime-tokio-rustls", "postgres", "json", "chrono", "uuid"] }
