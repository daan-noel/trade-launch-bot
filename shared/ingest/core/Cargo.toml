[package]
name = "ingest-core"
version = "0.1.0"
edition = "2021"
description = "Venue-agnostic ingest engine: Yellowstone/LaserStream gRPC wire types, neutral IngestEvent, config, slot-anchor, and RPC-backfill. No pump.fun coupling (Phase G: leaf modules; the IngestVenue seam lands in Phase H)."

[lib]
name = "ingest_core"
path = "src/lib.rs"

[features]
default = []
# Enables IngestEvent::RawTx + encode_payload: verbatim protobuf wire bytes of a
# SubscribeUpdateTransaction, persisted to raw_txs.payload (BYTEA). No JSON.
raw-tx = []
# Enables rpc_to_protobuf (backfill: RPC base64 -> SubscribeUpdateTransaction).
# Parses RPC JSON, so it owns the serde_json dep.
rpc-backfill = ["dep:serde_json"]

[dependencies]
# gRPC wire types (generated geyser client uses tonic; prost for the messages).
tonic = { version = "0.10", features = ["tls", "tls-webpki-roots"] }
prost = "0.12"

# Utils
tracing = "0.1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }

# Base58 / Base64 (backfill decode)
bs58 = "0.5"
base64 = "0.22"

# Solana SDK: VersionedTransaction decode in backfill.rs
solana-sdk = "1.17.27"
bincode = "1.3"

# serde_json: only for the rpc-backfill feature (RPC JSON parsing)
serde_json = { version = "1", optional = true }
