[package]
name = "ingest-core"
version = "0.1.0"
edition = "2021"
description = "Venue-agnostic ingest ENGINE: the `Feed` transport seam, the one reconnect/route supervisor, the `IngestVenue` seam, the generic `Ingest<V>` session, neutral IngestEvent, proto MESSAGES (no gRPC client), the single JSON->protobuf adapter, slot-anchor, and RPC-backfill. Knows no wire, no venue, and no env."

[lib]
name = "ingest_core"
path = "src/lib.rs"

[features]
default = []
# Enables IngestEvent::RawTx + encode_payload: verbatim protobuf wire bytes of a
# SubscribeUpdateTransaction, persisted to raw_txs.payload (BYTEA). No JSON.
raw-tx = []
# Enables `convert` - the ONE JSON-transaction -> SubscribeUpdateTransaction
# adapter, shared by the RPC backfill and every JSON live feed (NATS, WebSocket).
# `rpc-backfill` turns it on, and so does `ingest-nats`; it is not useful alone.
json-tx = ["dep:serde_json"]
# Enables rpc_to_protobuf (backfill: RPC base64 -> SubscribeUpdateTransaction)
# AND the getSignaturesForAddress / batched-getTransaction JSON-RPC pager. Parses
# RPC JSON (serde_json) and issues the JSON-RPC calls (reqwest + anyhow).
rpc-backfill = ["json-tx", "dep:reqwest", "dep:anyhow"]

[dependencies]
# Wire MESSAGE types only. The generated Yellowstone gRPC *client* lives in
# `ingest-laserstream` with the rest of that wire, which is what lets this crate
# carry no tonic and no TLS stack into a consumer that never streams.
prost = "0.12"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }

# Shared session state: pool index (feed <-> decode <-> handle) + resubscribe
# signal.
dashmap = "4.0"

# Utils
tracing = "0.1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }

# Base58 / Base64 (JSON -> protobuf conversion, backfill decode)
bs58 = "0.5"
base64 = "0.22"

# Solana SDK: VersionedTransaction decode in convert.rs
solana-sdk = "1.17.27"
bincode = "1.3"

# serde_json: the json-tx adapter (NATS / WS / RPC backfill JSON parsing)
serde_json = { version = "1", optional = true }
# reqwest + anyhow: only for the rpc-backfill feature (the JSON-RPC pager that
# fetches signatures + transactions). The pure `rpc_to_protobuf` JSON adapter
# needs neither; the pager does.
reqwest = { version = "0.11", features = ["json"], optional = true }
anyhow = { version = "1", optional = true }
