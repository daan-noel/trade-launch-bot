[package]
name = "ingest-pumpfun"
version = "0.1.0"
edition = "2021"
description = "Pump.fun ingest VENUE: protocol descriptor, classify + protobuf decode, pool PDA derivation - plus the assembly root, the only module that knows which transports exist and which one carries the bonding curve."

[lib]
name = "ingest_pumpfun"
path = "src/lib.rs"

[features]
default = []
# Forward to ingest-core so the raw_tx module + IngestEvent::RawTx variant (and
# the backfill module) exist when a consumer requests the feature.
raw-tx = ["ingest-core/raw-tx"]
rpc-backfill = ["ingest-core/rpc-backfill"]
# The NATS relay curve feed. Opt-in per consumer: hunter-live enables it, and a
# bin that only speaks gRPC never links the relay crate at all.
nats = ["dep:ingest-nats"]

[dependencies]
# The engine: IngestVenue seam this crate implements, the generic Ingest<V>
# session, proto wire types, IngestEvent, config, slot_anchor, raw_tx (feat),
# backfill (feat).
ingest-core = { path = "../core" }
# One wire each. gRPC is unconditional - it is the only transport that can filter
# for a pool PDA, so AMM traffic has nowhere else to go.
ingest-laserstream = { path = "../laserstream" }
ingest-nats = { path = "../nats", optional = true }

# Runtime + utils (Notify for the pool-changed signal; mpsc/watch in the façade).
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

# Shared state deps
dashmap = "4.0"
chrono = { version = "0.4", features = ["serde"] }

# Base58 / Base64 (protocol / pool PDA + decoder event payloads)
bs58 = "0.5"
base64 = "0.22"

# Borsh deserialization (pump.fun on-chain structs)
borsh = { version = "1", features = ["derive"] }

# Solana SDK: PDA derivation in pool.rs
solana-sdk = "1.17.27"

[dev-dependencies]
# The `nats_probe` example unwraps the relay envelope before handing the result
# to `ingest_core::convert`.
serde_json = "1"
# `feed_parity` prints the supervisor's own reconnect/scope log while it runs -
# the switch is only convincing if you can see both feeds react to it.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
