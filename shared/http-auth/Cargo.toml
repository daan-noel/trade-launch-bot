[package]
name = "http-auth"
version.workspace = true
edition.workspace = true
description = "Shared actix-web bearer-auth middleware: fail-closed gate on mutating (POST/PUT/DELETE/PATCH) API requests. One home for the `ApiAuth` app-data type + `require_bearer_auth` used by every real-money HTTP bin (hunter live/lab, forge live)."

[dependencies]
actix-web.workspace = true
serde_json.workspace = true
# Constant-time token comparison so a mutating request can't recover the secret
# bearer token byte-by-byte via response-timing (see `require_bearer_auth`).
constant_time_eq = "0.4"
