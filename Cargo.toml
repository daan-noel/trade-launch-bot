[workspace]
# ---------------------------------------------------------------------------
# Monorepo: ONE workspace over both products — `hunter/` (was meme-trading) and
# `forge/` (was solana-launch-platform) — plus `shared/`. This is the single
# [workspace] manifest.
#
# `resolver = "1"` stays — the borrowed standalone crates pin solana 1.17.27
# and "1"'s additive feature unification is what they were built against.
#
# Packages are namespaced by product (`hunter-*` / `forge-*`), so there is no
# duplicate-package-name collision. `[lib]`/`[[bin]]` TARGET names are kept from
# the pre-rename crates (lib `trading_core`/`platform_core`/`launcher`; bins
# `live`/`lab`/`slp-live`/`slp-lab`) so source `use` paths + Docker `--bin`
# flags stay valid; dependents map them via the `package = "..."` rename form.
# ---------------------------------------------------------------------------
members = [
    # hunter (was meme-trading)
    "hunter/core",
    "hunter/live",
    "hunter/lab",
    # shared standalone crates (used by BOTH products)
    "shared/pump-trader",
    "shared/ingest-laserstream",
    "shared/ingest/websocket",
    # forge (was solana-launch-platform); lake -> forge/lab/src/lake module,
    # ingest-host -> forge/live/src/ingest module (both folded, no longer crates)
    "forge/core",
    "forge/launcher",
    "forge/live",
    "forge/lab",
]
resolver = "1"

# A bare `cargo build` at the root builds only the hunter bins, not both
# products' entire graphs. Target specific crates with `-p <name>` / `--bin`.
default-members = [
    "hunter/live",
    "hunter/lab",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

# ---------------------------------------------------------------------------
# Shared crate versions, pinned once. meme-trading's packages declare their deps
# directly (no `workspace = true`); solana-launch-platform's packages consume
# these via `<dep>.workspace = true`. Both patterns coexist fine.
#
# The two borrowed standalone crates now live in the same repo, so their paths
# are rebased to the monorepo root (they move to shared/ in Phase 3). They have
# NO workspace deps of their own and MUST NOT appear in any `lab`/`slp-lab` dep
# graph (verify with `cargo tree -p lab` / `-p slp-lab`).
# ---------------------------------------------------------------------------
[workspace.dependencies]
pump-trader        = { path = "shared/pump-trader" }
ingest-laserstream = { path = "shared/ingest-laserstream", features = ["raw-tx"] }

# Shared third-party versions pinned once (mirrors meme-trading's set).
tokio     = { version = "1", features = ["full"] }
sqlx      = { version = "0.6", features = ["runtime-tokio-rustls", "postgres", "json", "chrono", "uuid", "migrate"] }
serde     = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
chrono    = { version = "0.4", features = ["serde"] }
uuid      = { version = "1", features = ["v4", "serde"] }
anyhow    = "1"
tracing   = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap   = "4.0"
actix-web = "4"
dotenvy   = "0.15"
aes-gcm   = "0.10"
zeroize   = { version = "1", features = ["zeroize_derive"] }
sha2      = "0.10"
base64    = "0.22"
bs58      = "0.5"
rand      = "0.8"
solana-sdk = "1.17.27"
solana-client = "1.17.27"

[profile.dev]
debug = true
