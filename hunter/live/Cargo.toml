[package]
name = "hunter-live"
version = "0.1.0"
edition = "2021"

[lib]
name = "live"
path = "src/lib.rs"

[[bin]]
name = "hunter-live"
path = "src/main.rs"

[dependencies]
trading_core = { path = "../core", package = "hunter-core" }
# The pure strategy engine the live adapters wrap (event/effect fold + types).
hunter-engine = { path = "../engine" }
ingest-pumpfun = { path = "../../shared/ingest/pumpfun", features = ["raw-tx", "rpc-backfill", "nats"] }
# The gRPC wire, named directly by `services/laserstream_replay.rs`: a one-shot
# `Subscribe` outside the ingest session, so it needs `connect` + the request
# builder rather than the venue façade.
ingest-laserstream = { path = "../../shared/ingest/laserstream" }
# `probe`/`claim` are off by default in the crate; the live box uses both.
# Key stays `pump-trader` (lib `pump_trader`) via the façade; package renamed to
# `executor-pumpfun` and rehomed under shared/executor/ by the executor split.
pump-trader = { package = "executor-pumpfun", path = "../../shared/executor/pumpfun", features = ["probe", "claim"] }
# Shared fail-closed bearer-auth middleware (SSOT for the mutating-route gate).
http-auth = { path = "../../shared/http-auth" }

# Tokio
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# Web framework (for handlers + HTTP server)
actix-web = "4"
actix-cors = "0.7"

# Database
sqlx = { version = "0.6", features = ["runtime-tokio-rustls", "postgres", "json", "chrono", "uuid", "migrate"] }

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Errors
anyhow = "1"

# Shared state
dashmap = "4.0"
smallvec = "1"

# Config
dotenvy = "0.15"

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async trait
async-trait = "0.1"

# Solana (needed by strategies and trader)
solana-sdk = "1.17.27"

# Encoding (strategies use these for tx construction)
bs58 = "0.5"
base64 = "0.22"
bincode = "1.3"

# Reqwest
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# Futures
futures-util = "0.3"
