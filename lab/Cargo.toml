[package]
name = "lab"
version = "0.1.0"
edition = "2021"

[lib]
name = "lab"
path = "src/lib.rs"

[[bin]]
name = "lab"
path = "src/main.rs"

[dependencies]
# Sweep CU cost-model constants come from `trading_core::config::constants`, so
# the analysis bin never pulls the trading/RPC stack (`pump-trader`).
trading_core = { path = "../trading_core" }

# Tokio
tokio = { version = "1", features = ["full"] }
# Streamed SSE progress in the grouped-sweep handler.
tokio-stream = "0.1"

# Web framework (for handlers + HTTP server)
actix-web = "4"
actix-cors = "0.7"

# Database
sqlx = { version = "0.6", features = ["runtime-tokio-rustls", "postgres", "json", "chrono", "uuid", "migrate"] }

# Serialization
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errors
anyhow = "1"

# Shared state
dashmap = "4.0"

# Config
dotenvy = "0.15"

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async trait
async-trait = "0.1"

# Futures
futures-util = "0.3"

# Param-sweep / backtest engine: data-parallel sweep over tokens, columnar
# Parquet corpus + result emit for the Python scoring layer.
rayon = "1"
arrow = "53"
parquet = "53"
# Cross-platform process RSS read for the sweep memory observability milestones.
memory-stats = "1"
# Deterministic sampling in the sweep grid / cost model.
rand = "0.8"
# DuckDB query engine over the Parquet lake (Phase 4 corpus layer). `bundled`
# compiles libduckdb in-tree so there's no system dependency — lab is
# workstation-only (never shipped to EC2), so the heavy native build is local-only.
# `parquet` statically links the parquet extension into the binary so `read_parquet`
# never tries to autoload/download it at runtime (that download fails offline / when
# extensions.duckdb.org is blocked — "Failed to download extension parquet").
duckdb = { version = "1", features = ["bundled", "parquet"] }
