[package]
name = "trading_core"
version = "0.1.0"
edition = "2021"
description = "Shared core for the meme-trading backends: config, models, storage, core services/state, api framework, core handlers, strategy domain."

[lib]
name = "trading_core"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
actix-web = "4"
actix-cors = "0.7"

futures-util = "0.3"

# Database
sqlx = { version = "0.6", features = ["runtime-tokio-rustls", "postgres", "json", "chrono", "uuid", "migrate"] }

# Serialization
# `rc` enables Serialize/Deserialize for Arc<T> — events embed Arc<RawTransaction>
# so a multi-trade tx clones a pointer per leg, not the full result JSON.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

# Config / env
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Shared state
dashmap = "4.0"

# Async trait
async-trait = "0.1"

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1"
anyhow = "1"

# URL building
url = "2"

reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# Solana on-chain transaction construction and RPC
solana-client = "1.17.27"
solana-sdk = "1.17.27"
