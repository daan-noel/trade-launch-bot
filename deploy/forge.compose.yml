# ---------------------------------------------------------------------------
# forge — MERGED live + lab stack for a single shared deploy server.
#
# ONE Postgres (the shared DB volume `pgdata`) is used by BOTH the live backend
# (package + bin `forge-live`) and the lab analysis backend (package + bin
# `forge-lab`) — same `forge_bot` database (lab analyzes
# what live produces). Two Postgres containers can NOT safely mount one PGDATA
# (postmaster lock), so sharing = one DB container, two api clients. That is why
# the live and lab tiers are folded together in this one merged compose file
# rather than run as separate stacks.
#
# PORTS — all names + numbers are defined in forge/.env (the "PORTS" block).
# Scheme 8·F·C·P: 8 fixed · family(2=forge) · component(1 live-ui 3 live-api
# 4 lab-api) · protocol(0 http 1 https). forge-lab is API-only (no lab-ui).
# Defaults below MIRROR that block; pass --env-file to override:
#
#   service   host port(s)                container   published?
#   postgres  127.0.0.1:${DB_PORT:-5556}:5432  forge-postgres  loopback-only (SSH tunnel)
#   live-api  (none)                      forge-live-api    no — nginx-only upstream, binds ${LIVE_API_PORT:-8230}
#   live-ui   ${LIVE_UI_HTTP_PORT:-8210}:80  ${LIVE_UI_HTTPS_PORT:-8211}:443   yes
#   lab-api   127.0.0.1:${LAB_API_PORT:-8240}:8240  forge-lab-api  loopback-only (SSH tunnel; no UI/nginx)
#
# 5556 (not 5555) so the forge Postgres coexists with hunter's on the same host;
# the live-ui host ports (82xx) are likewise offset from hunter's (81xx).
#
# The Dockerfiles + nginx template still live under deploy/forge-live/ and
# deploy/forge-lab/ (build context = repo root, so their paths are unchanged).
# nginx proxies /api to live-api at ${LIVE_API_PORT} via envsubst. forge-lab is
# build-only — its `image:` just names the locally-built image (matching the
# live tiers' style); it is never pushed/pulled from ECR. It builds on this box;
# the lake cold tier is workstation-scale, so size the box accordingly.
#
# RESOURCE NOTE: lab pulls duckdb/arrow/parquet/rayon and runs heavy sweeps that
# contend with the latency-sensitive live hot path over the SAME Postgres. Only
# co-locate them on a box sized well above the old 2vCPU/4GB live EC2.
#
# Up / update:  docker compose --env-file forge/.env -f deploy/forge.compose.yml up -d --build
# ---------------------------------------------------------------------------

# Project name. Without this, Compose defaults it to the parent dir (`deploy`),
# so the forge AND hunter stacks would collapse into one shared `deploy` project
# (colliding networks + cross-stack orphan warnings on `down`). Pin it per family.
name: forge

services:
  postgres:
    container_name: forge-postgres
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=timescaledb"
      - "-c"
      - "timescaledb.max_background_workers=${TIMESCALEDB_MAX_BG_WORKERS:-2}"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-80}"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}"
      - "-c"
      - "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}"
      - "-c"
      - "work_mem=${POSTGRES_WORK_MEM:-16MB}"
      - "-c"
      - "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}"
      - "-c"
      - "random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.1}"
      - "-c"
      - "effective_io_concurrency=${POSTGRES_EFFECTIVE_IO_CONCURRENCY:-200}"
      - "-c"
      - "max_parallel_workers_per_gather=${POSTGRES_MAX_PARALLEL_PER_GATHER:-1}"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "min_wal_size=80MB"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "synchronous_commit=off"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set it in the env-file, no default}
      POSTGRES_DB: ${POSTGRES_DB:-forge_bot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Loopback-only: reachable on the host via an SSH tunnel / local mirror sync,
      # never on 0.0.0.0. In-network services reach it by the `postgres` hostname.
      - "127.0.0.1:${DB_PORT:-5556}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-forge_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The live bin (`forge-live`). NOT host-published — reached only through
  # live-ui's nginx at http://live-api:${LIVE_API_PORT} (envsubst upstream).
  live-api:
    container_name: forge-live-api
    image: ${ECR_REGISTRY:-forge}/forge-live-api:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/forge-live/api.Dockerfile
    restart: unless-stopped
    # tini as PID 1: forwards SIGTERM so `docker stop`/redeploy kills it promptly.
    init: true
    env_file: ../forge/.env
    environment:
      HOST: 0.0.0.0
      PORT: ${LIVE_API_PORT:-8230}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set it in the env-file, no default}@postgres:5432/${POSTGRES_DB:-forge_bot}
    depends_on:
      postgres:
        condition: service_healthy

  # forge UI (nginx, TLS-terminating + Basic-auth). Serves the built SPA and
  # proxies /api to live-api. The forge backend runs a fail-closed bearer gate,
  # so nginx injects ${API_AUTH_TOKEN} + the upstream ${LIVE_API_PORT} via
  # envsubst — see deploy/forge-live/nginx/default.conf.template.
  live-ui:
    container_name: forge-live-ui
    image: ${ECR_REGISTRY:-forge}/forge-live-ui:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/forge-live/ui.Dockerfile
    restart: unless-stopped
    # env_file supplies both API_AUTH_TOKEN and LIVE_API_PORT to the container;
    # nginx's envsubst (filter below) injects them into the /api proxy at start.
    env_file: ../forge/.env
    environment:
      NGINX_ENVSUBST_FILTER: "API_AUTH_TOKEN|LIVE_API_PORT"
      # Explicit (with default) so a missing/unsynced .env can't leave the nginx
      # upstream port empty and crash the container. Matches live-api's bind.
      LIVE_API_PORT: ${LIVE_API_PORT:-8230}
    ports:
      - "${LIVE_UI_HTTP_PORT:-8210}:80"
      - "${LIVE_UI_HTTPS_PORT:-8211}:443"
    depends_on:
      - live-api

  # The analysis bin (`forge-lab`). API-only (no UI/nginx), so it must NOT sit on
  # 0.0.0.0 — reach it LOOPBACK-ONLY on ${LAB_API_PORT} via an SSH tunnel. It also
  # now carries the shared bearer gate (fail-closed on any future mutating route).
  # Build-only: the `image:` just names the
  # locally-built image; the lake cold tier (duckdb/arrow/parquet) is
  # workstation-scale, so it is never pushed/pulled as an ECR image.
  # Lake export (batch): docker compose -f deploy/forge.compose.yml run --rm lab-api forge-lab lake-export
  lab-api:
    container_name: forge-lab-api
    image: ${ECR_REGISTRY:-forge}/forge-lab-api:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/forge-lab/api.Dockerfile
    restart: unless-stopped
    init: true
    env_file: ../forge/.env
    environment:
      HOST: 0.0.0.0
      PORT: ${LAB_API_PORT:-8240}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set it in the env-file, no default}@postgres:5432/${POSTGRES_DB:-forge_bot}
      SWEEP_LAKE_DIR: /lake
    volumes:
      - lakedata:/lake
    ports:
      - "127.0.0.1:${LAB_API_PORT:-8240}:${LAB_API_PORT:-8240}"
    depends_on:
      postgres:
        condition: service_healthy

# Fixed volume names (NOT project-namespaced) so the data volumes are stable
# regardless of the compose project name this stack is brought up under.
volumes:
  pgdata:
    name: forge-pgdata
  lakedata:
    name: forge-lakedata
