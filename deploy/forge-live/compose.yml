# ---------------------------------------------------------------------------
# forge-live — production stack: postgres + forge LIVE bin (package
# `forge-live`, bin `slp-live`): ingest + launcher + trading + thin HTTP.
# Ships to EC2. The analysis bin (`slp-lab`) is workstation-only (see
# deploy/forge-lab/) and never built here.
#
# Image carries BOTH `image:` (ECR ref, pulled on EC2) and `build:` (context =
# repo root, builds on the workstation).
#
# Up:    docker compose -f deploy/forge-live/compose.yml up -d --build
# Config: forge/.env (see forge/.env.example). Host port 5556 (coexists with
# hunter's 5555); live published on 8091.
# ---------------------------------------------------------------------------

services:
  postgres:
    container_name: forge-postgres
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    # EC2 (2vCPU/4GB) tuning, carried from hunter.
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=timescaledb"
      - "-c"
      - "timescaledb.max_background_workers=${TIMESCALEDB_MAX_BG_WORKERS:-2}"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-80}"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}"
      - "-c"
      - "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}"
      - "-c"
      - "work_mem=${POSTGRES_WORK_MEM:-16MB}"
      - "-c"
      - "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}"
      - "-c"
      - "random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.1}"
      - "-c"
      - "effective_io_concurrency=${POSTGRES_EFFECTIVE_IO_CONCURRENCY:-200}"
      - "-c"
      - "max_parallel_workers_per_gather=${POSTGRES_MAX_PARALLEL_PER_GATHER:-1}"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "min_wal_size=80MB"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "synchronous_commit=off"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-launch_platform}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5556}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-launch_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  slp-live:
    container_name: forge-live
    image: ${ECR_REGISTRY:-forge}/forge-live:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/forge-live/Dockerfile
    restart: unless-stopped
    init: true
    env_file: ../../forge/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8081
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-launch_platform}
    ports:
      - "${SLP_LIVE_HOST_PORT:-8091}:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
