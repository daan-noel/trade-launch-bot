# ---------------------------------------------------------------------------
# forge-live — production stack: postgres + forge LIVE backend (package
# `forge-live`, bin `slp-live`, api.Dockerfile): ingest + launcher + trading +
# thin HTTP API + forge UI (nginx + TLS/Basic-auth, ui.Dockerfile). Ships to
# EC2. The analysis bin (`slp-lab`) is workstation-only (see deploy/forge-lab/)
# and never built here.
#
# Each image carries BOTH `image:` (ECR ref, pulled on EC2) and `build:`
# (context = repo root, builds on the workstation). Only nginx (`ui`) is
# published; the backend is reached only through the proxy.
#
# Up:    docker compose -f deploy/forge-live/compose.yml up -d --build
# Config: forge/.env (see forge/.env.example). Postgres on host 5556 (coexists
# with hunter's 5555); UI on 80/443.
# ---------------------------------------------------------------------------

services:
  postgres:
    container_name: forge-postgres
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    # EC2 (2vCPU/4GB) tuning, carried from hunter.
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=timescaledb"
      - "-c"
      - "timescaledb.max_background_workers=${TIMESCALEDB_MAX_BG_WORKERS:-2}"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-80}"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}"
      - "-c"
      - "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}"
      - "-c"
      - "work_mem=${POSTGRES_WORK_MEM:-16MB}"
      - "-c"
      - "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}"
      - "-c"
      - "random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.1}"
      - "-c"
      - "effective_io_concurrency=${POSTGRES_EFFECTIVE_IO_CONCURRENCY:-200}"
      - "-c"
      - "max_parallel_workers_per_gather=${POSTGRES_MAX_PARALLEL_PER_GATHER:-1}"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "min_wal_size=80MB"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "synchronous_commit=off"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-launch_platform}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5556}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-launch_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The live bin (`slp-live`). Named `api`; nginx reaches it at
  # `proxy_pass http://api:8081` (see nginx/default.conf).
  api:
    container_name: forge-live-api
    image: ${ECR_REGISTRY:-forge}/forge-live-api:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/forge-live/api.Dockerfile
    restart: unless-stopped
    # tini as PID 1: forwards SIGTERM so `docker stop`/redeploy kills it promptly.
    init: true
    env_file: ../../forge/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8081
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-launch_platform}
    depends_on:
      postgres:
        condition: service_healthy

  # forge UI (nginx, TLS-terminating + Basic-auth). Serves the built SPA and
  # proxies /api to the `api` backend above. Like hunter, the forge backend now
  # runs a fail-closed bearer gate, so nginx injects ${API_AUTH_TOKEN} into the
  # /api proxy via envsubst — see nginx/default.conf.template.
  ui:
    container_name: forge-live-ui
    image: ${ECR_REGISTRY:-forge}/forge-live-ui:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/forge-live/ui.Dockerfile
    restart: unless-stopped
    # env_file (not `${API_AUTH_TOKEN}` interpolation) so the token is read from
    # forge/.env into the container env, where nginx's envsubst picks it up.
    # NGINX_ENVSUBST_FILTER limits substitution to just this var.
    env_file: ../../forge/.env
    environment:
      NGINX_ENVSUBST_FILTER: API_AUTH_TOKEN
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api

volumes:
  pgdata:
