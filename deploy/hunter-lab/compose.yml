# ---------------------------------------------------------------------------
# hunter-lab — STANDALONE analysis stack: postgres (TimescaleDB) + analysis bin
# (`hunter-lab`, api.Dockerfile) + lab UI (nginx + TLS/Basic-auth, ui.Dockerfile). Run
# the lab tier on its own, WITHOUT the live trading tier. For live + lab running
# CONCURRENTLY on one host (one shared postgres process), use the merged
# deploy/hunter/compose.yml instead.
#
# SHARED DB (same as the root/merged stack): postgres here uses container_name
# `hunter-postgres` and the FIXED named volume `hunter-pgdata` — the SAME
# container name + data volume as deploy/hunter/compose.yml AND the sibling
# deploy/hunter-live/compose.yml. So whichever of {merged, live-only, lab-only}
# you bring up, they all read/write ONE `meme_bot` database on ONE volume.
#
# ⚠ RUN ONE STACK AT A TIME. Because all three share the `hunter-postgres`
# container name + `hunter-pgdata` volume, only one may be `up` at once — a
# second `up` fails on the name/volume conflict (a safe failure, no corruption).
# `docker compose -f <file> down` the current stack before bringing up another.
#
# PORTS come from hunter/.env (the "PORTS" block, scheme 8·F·C·P). Defaults below
# MIRROR that block; pass --env-file to override:
#   postgres  ${DB_PORT:-5555}:5432        published
#   lab-api   ${LAB_API_PORT:-8140}        published (direct access + `run --rm` batch)
#   lab-ui    ${LAB_UI_HTTP_PORT:-8120}:80 ${LAB_UI_HTTPS_PORT:-8121}:443  published
#
# Each image carries BOTH `image:` (ECR ref, pulled on the lab server) and
# `build:` (context = repo root, builds on the workstation).
#
# Up / update:  docker compose --env-file hunter/.env -f deploy/hunter-lab/compose.yml up -d --build
# Lake export (batch): docker compose --env-file hunter/.env -f deploy/hunter-lab/compose.yml run --rm lab-api hunter-lab lake-export
# Local dev alt: `npm run dev:lab` (vite, HMR) against `cargo run -p hunter-lab` on 8082.
# Config: hunter/.env (see hunter/.env.example).
# ---------------------------------------------------------------------------

services:
  postgres:
    container_name: hunter-postgres
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=timescaledb"
      - "-c"
      - "timescaledb.max_background_workers=${TIMESCALEDB_MAX_BG_WORKERS:-2}"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-80}"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}"
      - "-c"
      - "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}"
      - "-c"
      - "work_mem=${POSTGRES_WORK_MEM:-16MB}"
      - "-c"
      - "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}"
      - "-c"
      - "random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.1}"
      - "-c"
      - "effective_io_concurrency=${POSTGRES_EFFECTIVE_IO_CONCURRENCY:-200}"
      - "-c"
      - "max_parallel_workers_per_gather=${POSTGRES_MAX_PARALLEL_PER_GATHER:-1}"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "min_wal_size=80MB"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "synchronous_commit=off"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-meme_bot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5555}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-meme_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The analysis bin (`hunter-lab`). Host-published on ${LAB_API_PORT} AND proxied by
  # lab-ui's nginx at http://lab-api:${LAB_API_PORT}. The service name `lab-api`
  # matches nginx/default.conf.template's proxy_pass.
  lab-api:
    container_name: hunter-lab-api
    image: ${ECR_REGISTRY:-hunter}/hunter-lab-api:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/hunter-lab/api.Dockerfile
    restart: unless-stopped
    init: true
    env_file: ../../hunter/.env
    environment:
      HOST: 0.0.0.0
      PORT: ${LAB_API_PORT:-8140}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-meme_bot}
      SWEEP_LAKE_DIR: /lake
    volumes:
      - lakedata:/lake
    ports:
      - "${LAB_API_PORT:-8140}:${LAB_API_PORT:-8140}"
    depends_on:
      postgres:
        condition: service_healthy

  # Lab UI (nginx, TLS-terminating + Basic-auth). Serves the lab bundle and
  # proxies /api to the `lab-api` backend above, injecting the bearer token
  # (${API_AUTH_TOKEN}) + upstream (${LAB_API_PORT}) via envsubst. Mirrors live.
  lab-ui:
    container_name: hunter-lab-ui
    image: ${ECR_REGISTRY:-hunter}/hunter-lab-ui:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/hunter-lab/ui.Dockerfile
      args:
        VITE_API_BASE: ""
        VITE_POLL_INTERVAL_MS: ${VITE_POLL_INTERVAL_MS:-5000}
    restart: unless-stopped
    env_file: ../../hunter/.env
    environment:
      NGINX_ENVSUBST_FILTER: "API_AUTH_TOKEN|LAB_API_PORT"
      # Explicit (with default) so a missing/unsynced .env can't leave the nginx
      # upstream port empty and crash the container. Matches lab-api's bind.
      LAB_API_PORT: ${LAB_API_PORT:-8140}
    ports:
      - "${LAB_UI_HTTP_PORT:-8120}:80"
      - "${LAB_UI_HTTPS_PORT:-8121}:443"
    depends_on:
      - lab-api

# Fixed volume names (NOT project-namespaced) so live-only, lab-only, and the
# merged stack all mount the SAME postgres data + lake. See the header note.
volumes:
  pgdata:
    name: hunter-pgdata
  lakedata:
    name: hunter-lakedata
