# ---------------------------------------------------------------------------
# hunter-lab — production stack for the ANALYSIS tier: postgres (TimescaleDB) +
# analysis bin (`lab`, api.Dockerfile) + lab UI (nginx + TLS/Basic-auth,
# ui.Dockerfile). Deploys to its OWN server — NOT the live EC2 box: the lab bin
# pulls arrow/parquet/rayon + a bundled libduckdb (heavy C++ build) and needs
# more resources than the 2vCPU/4GB live host.
#
# Each image carries BOTH `image:` (ECR ref, pulled on the lab server) and
# `build:` (context = repo root, builds on the workstation), exactly like the
# live stack. The live stack (deploy/hunter-live/) builds the SEPARATE api /
# `index.html` images; lab and live never share a backend binary or a bundle.
#
# Up / update:   docker compose -f deploy/hunter-lab/compose.yml up -d --build
# Local dev alt: `npm run dev:lab` (vite, HMR) against `cargo run -p lab` on 8082.
# Lake export (batch): docker compose -f deploy/hunter-lab/compose.yml run --rm api lab lake-export
# Config: hunter/.env (see hunter/.env.example). Backend on 8082, UI on 443.
# ---------------------------------------------------------------------------

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=timescaledb"
      - "-c"
      - "timescaledb.max_background_workers=${TIMESCALEDB_MAX_BG_WORKERS:-2}"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-80}"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}"
      - "-c"
      - "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}"
      - "-c"
      - "work_mem=${POSTGRES_WORK_MEM:-16MB}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-meme_bot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5555}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-meme_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${ECR_REGISTRY:-hunter}/hunter-lab-api:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/hunter-lab/api.Dockerfile
    restart: unless-stopped
    init: true
    env_file: ../../hunter/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8082
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-meme_bot}
      SWEEP_LAKE_DIR: /lake
    volumes:
      - lakedata:/lake
    ports:
      - "${LAB_HOST_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy

  # Lab UI (nginx, TLS-terminating + Basic-auth). Serves the lab bundle and
  # proxies /api to the `api` backend above, injecting the bearer token
  # (${API_AUTH_TOKEN}) via nginx's envsubst so the lab bin's fail-closed
  # mutating routes are accepted. Mirrors the live UI.
  ui:
    image: ${ECR_REGISTRY:-hunter}/hunter-lab-ui:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/hunter-lab/ui.Dockerfile
      args:
        VITE_API_BASE: ""
        VITE_POLL_INTERVAL_MS: ${VITE_POLL_INTERVAL_MS:-5000}
    restart: unless-stopped
    # env_file (not `${API_AUTH_TOKEN}` interpolation) so the token is read from
    # hunter/.env into the container env, where nginx's envsubst picks it up.
    # NGINX_ENVSUBST_FILTER limits substitution to just this var.
    env_file: ../../hunter/.env
    environment:
      NGINX_ENVSUBST_FILTER: API_AUTH_TOKEN
    # Host ports default off 80/443 so the lab stack can coexist with the live
    # stack on one workstation; set them to 80/443 on the dedicated lab server.
    ports:
      - "${LAB_WEB_HTTP_PORT:-8080}:80"
      - "${LAB_WEB_HTTPS_PORT:-8443}:443"
    depends_on:
      - api

volumes:
  pgdata:
  lakedata:
