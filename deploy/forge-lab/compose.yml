# ---------------------------------------------------------------------------
# forge-lab — STANDALONE analysis stack: postgres (TimescaleDB) + forge analysis
# bin (package `forge-lab`, bin `slp-lab`). API-only (no UI/nginx for forge lab)
# — reached directly on the host-published ${LAB_API_PORT}. Run the lab tier on
# its own, WITHOUT the live tier. For live + lab running CONCURRENTLY on one host
# (one shared postgres process), use the merged deploy/forge/compose.yml instead.
#
# Build-only: the lake cold tier (duckdb/arrow/parquet, filled on the
# workstation) is workstation-scale and NEVER ships to the small EC2 — so this
# compose omits the ECR registry ref (`image:`) and builds locally.
#
# SHARED DB (same as the root/merged stack): postgres here uses container_name
# `forge-postgres` and the FIXED named volume `forge-pgdata` — the SAME
# container name + data volume as deploy/forge/compose.yml AND the sibling
# deploy/forge-live/compose.yml. So whichever of {merged, live-only, lab-only}
# you bring up, they all read/write ONE `launch_platform` database on ONE volume.
#
# ⚠ RUN ONE STACK AT A TIME. Because all three share the `forge-postgres`
# container name + `forge-pgdata` volume, only one may be `up` at once — a
# second `up` fails on the name/volume conflict (a safe failure, no corruption).
# `docker compose -f <file> down` the current stack before bringing up another.
#
# PORTS come from forge/.env (the "PORTS" block, scheme 8·F·C·P). Defaults below
# MIRROR that block; pass --env-file to override:
#   postgres  ${DB_PORT:-5556}:5432   published
#   lab-api   ${LAB_API_PORT:-8240}   published (direct access + `run --rm` batch)
#
# Up / update:  docker compose --env-file forge/.env -f deploy/forge-lab/compose.yml up -d --build
# Lake export (batch): docker compose --env-file forge/.env -f deploy/forge-lab/compose.yml run --rm lab-api slp-lab lake-export
# Config: forge/.env (see forge/.env.example).
# ---------------------------------------------------------------------------

services:
  postgres:
    container_name: forge-postgres
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=timescaledb"
      - "-c"
      - "timescaledb.max_background_workers=${TIMESCALEDB_MAX_BG_WORKERS:-2}"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-80}"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}"
      - "-c"
      - "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}"
      - "-c"
      - "work_mem=${POSTGRES_WORK_MEM:-16MB}"
      - "-c"
      - "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}"
      - "-c"
      - "random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.1}"
      - "-c"
      - "effective_io_concurrency=${POSTGRES_EFFECTIVE_IO_CONCURRENCY:-200}"
      - "-c"
      - "max_parallel_workers_per_gather=${POSTGRES_MAX_PARALLEL_PER_GATHER:-1}"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "min_wal_size=80MB"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "synchronous_commit=off"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-launch_platform}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5556}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-launch_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The analysis bin (`slp-lab`). API-only (no UI), reached directly on the
  # host-published ${LAB_API_PORT}. Build-only: never an ECR image (see header).
  lab-api:
    container_name: forge-lab-api
    build:
      context: ../..
      dockerfile: deploy/forge-lab/api.Dockerfile
    restart: unless-stopped
    init: true
    env_file: ../../forge/.env
    environment:
      HOST: 0.0.0.0
      PORT: ${LAB_API_PORT:-8240}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-launch_platform}
      SWEEP_LAKE_DIR: /lake
    volumes:
      - lakedata:/lake
    ports:
      - "${LAB_API_PORT:-8240}:${LAB_API_PORT:-8240}"
    depends_on:
      postgres:
        condition: service_healthy

# Fixed volume names (NOT project-namespaced) so live-only, lab-only, and the
# merged stack all mount the SAME postgres data + lake. See the header note.
volumes:
  pgdata:
    name: forge-pgdata
  lakedata:
    name: forge-lakedata
