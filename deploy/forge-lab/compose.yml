# ---------------------------------------------------------------------------
# forge-lab — LOCAL DEV ONLY: postgres (TimescaleDB) + forge analysis bin
# (package `forge-lab`, bin `slp-lab`). The lake cold tier (duckdb/arrow/parquet
# when filled) is workstation-only and NEVER ships to EC2 — so this compose
# omits the ECR registry ref (build only).
#
# Run:   docker compose -f deploy/forge-lab/compose.yml up -d --build
# Config: forge/.env (see forge/.env.example). DB 5556, lab published on 8092.
# ---------------------------------------------------------------------------

services:
  postgres:
    container_name: forge-lab-postgres
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=timescaledb"
      - "-c"
      - "timescaledb.max_background_workers=${TIMESCALEDB_MAX_BG_WORKERS:-2}"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-80}"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}"
      - "-c"
      - "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}"
      - "-c"
      - "work_mem=${POSTGRES_WORK_MEM:-16MB}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-launch_platform}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5556}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-launch_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  slp-lab:
    container_name: forge-lab
    build:
      context: ../..
      dockerfile: deploy/forge-lab/api.Dockerfile
    restart: unless-stopped
    init: true
    env_file: ../../forge/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8092
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-launch_platform}
      SWEEP_LAKE_DIR: /lake
    volumes:
      - lakedata:/lake
    ports:
      - "${LAB_HOST_PORT:-8092}:8092"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  lakedata:
