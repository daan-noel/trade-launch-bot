# ---------------------------------------------------------------------------
# hunter-live — STANDALONE live stack: postgres + Rust backend (`live`) + nginx
# (frontend static + /api proxy). Run the live tier on its own, WITHOUT the lab
# analysis tier. For live + lab running CONCURRENTLY on one host (one shared
# postgres process), use the merged deploy/hunter/compose.yml instead.
#
# SHARED DB (same as the root/merged stack): postgres here uses container_name
# `hunter-postgres` and the FIXED named volume `hunter-pgdata` — the SAME
# container name + data volume as deploy/hunter/compose.yml AND the sibling
# deploy/hunter-lab/compose.yml. So whichever of {merged, live-only, lab-only}
# you bring up, they all read/write ONE `meme_bot` database on ONE volume.
#
# ⚠ RUN ONE STACK AT A TIME. Because all three share the `hunter-postgres`
# container name + `hunter-pgdata` volume, only one may be `up` at once — a
# second `up` fails on the name/volume conflict (a safe failure, no corruption).
# `docker compose -f <file> down` the current stack before bringing up another.
#
# PORTS come from hunter/.env (the "PORTS" block, scheme 8·F·C·P). Defaults below
# MIRROR that block; pass --env-file to override:
#   postgres  ${DB_PORT:-5555}:5432          published
#   live-api  binds ${LIVE_API_PORT:-8130}   NOT published (nginx-only upstream)
#   live-ui   ${LIVE_UI_HTTP_PORT:-8110}:80  ${LIVE_UI_HTTPS_PORT:-8111}:443  published
#
# Each image carries BOTH `image:` (ECR ref, pulled on the deploy box) and
# `build:` (context = repo root, builds on the workstation).
#
# Up / update:  docker compose --env-file hunter/.env -f deploy/hunter-live/compose.yml up -d --build
# Config: hunter/.env (see hunter/.env.example). Only nginx (live-ui) is published.
# ---------------------------------------------------------------------------

services:
  postgres:
    container_name: hunter-postgres
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    # EC2 (2vCPU/4GB) tuning: keep max_connections low, bias planner to index
    # scans on SSD/EBS, cap parallel workers off the ingest cores. Every value
    # is env-overridable to dial per box size.
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=timescaledb"
      - "-c"
      - "timescaledb.max_background_workers=${TIMESCALEDB_MAX_BG_WORKERS:-2}"
      - "-c"
      - "max_connections=${POSTGRES_MAX_CONNECTIONS:-80}"
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}"
      - "-c"
      - "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}"
      - "-c"
      - "work_mem=${POSTGRES_WORK_MEM:-16MB}"
      - "-c"
      - "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}"
      - "-c"
      - "random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.1}"
      - "-c"
      - "effective_io_concurrency=${POSTGRES_EFFECTIVE_IO_CONCURRENCY:-200}"
      - "-c"
      - "max_parallel_workers_per_gather=${POSTGRES_MAX_PARALLEL_PER_GATHER:-1}"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "min_wal_size=80MB"
      - "-c"
      - "wal_compression=on"
      - "-c"
      - "synchronous_commit=off"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-meme_bot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5555}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-meme_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The live trading bin (`live`). NOT host-published — reached only through
  # live-ui's nginx at http://live-api:${LIVE_API_PORT} (envsubst upstream). The
  # service name `live-api` matches nginx/default.conf.template's proxy_pass.
  live-api:
    container_name: hunter-live-api
    image: ${ECR_REGISTRY:-hunter}/hunter-live-api:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/hunter-live/api.Dockerfile
    restart: unless-stopped
    # tini as PID 1: forwards SIGTERM so `docker stop`/redeploy kills it promptly.
    init: true
    env_file: ../../hunter/.env
    environment:
      HOST: 0.0.0.0
      PORT: ${LIVE_API_PORT:-8130}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-meme_bot}
    depends_on:
      postgres:
        condition: service_healthy

  live-ui:
    container_name: hunter-live-ui
    image: ${ECR_REGISTRY:-hunter}/hunter-live-ui:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deploy/hunter-live/ui.Dockerfile
      args:
        VITE_API_BASE: ""
        VITE_POLL_INTERVAL_MS: ${VITE_POLL_INTERVAL_MS:-5000}
    restart: unless-stopped
    # env_file supplies both API_AUTH_TOKEN and LIVE_API_PORT to the container;
    # nginx's envsubst (filter below) injects them into the /api proxy at start.
    env_file: ../../hunter/.env
    environment:
      NGINX_ENVSUBST_FILTER: "API_AUTH_TOKEN|LIVE_API_PORT"
      # Explicit (with default) so a missing/unsynced .env can't leave the nginx
      # upstream port empty and crash the container. Matches live-api's bind.
      LIVE_API_PORT: ${LIVE_API_PORT:-8130}
    ports:
      - "${LIVE_UI_HTTP_PORT:-8110}:80"
      - "${LIVE_UI_HTTPS_PORT:-8111}:443"
    depends_on:
      - live-api

# Fixed volume name (NOT project-namespaced) so live-only, lab-only, and the
# merged stack all mount the SAME postgres data. See the header note.
volumes:
  pgdata:
    name: hunter-pgdata
